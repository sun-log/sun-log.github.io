  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-.02em; margin:0;}
  /* ===== Liquid Glass (gaya Apple) =====
     panel bening + blur kuat + tepi berkilau (specular rim) di sudut kiri-atas & kanan-bawah */
  .topbar,.card,.row,.stat,.login-card,details.hist,.team-btn,.key,.chip,.btn-ghost,.steps button,.sheet-preview,.evkonf,.pickbar,.banner,.tabbar{
    -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);}
  .card,.row,.stat,.login-card,details.hist,.team-btn,.key,.evkonf{
    position:relative; background:var(--lg-fill) !important; border:1px solid rgba(255,255,255,.14) !important; box-shadow:var(--lg-shadow) !important;}
  .card::before,.row::before,.stat::before,.login-card::before,details.hist::before,.team-btn::before,.key::before,.evkonf::before,.btn-primary::before,.btn-ghost::before,.chip::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.10) 28%, rgba(255,255,255,0) 55%, rgba(255,255,255,.08) 75%, rgba(255,255,255,.45));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;}
  .btn-primary,.btn-ghost,.chip{position:relative;}
  .chip{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:var(--ink);}
  .chip.active{background:rgba(255,255,255,.88); color:#111214; border-color:transparent;}
  .btn-ghost{background:rgba(255,255,255,.08) !important; border-color:rgba(255,255,255,.14) !important; color:var(--ink) !important;}
  .btn-primary{background:linear-gradient(180deg, rgba(232,218,192,.96), rgba(214,196,163,.86)) !important; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 10px 28px rgba(214,196,163,.22);}
  .topbar{background:rgba(12,13,16,.55) !important; border-bottom:1px solid rgba(255,255,255,.10);}
  .banner{border:1px solid rgba(255,255,255,.10);}
  .pickbar{background:rgba(20,21,24,.45) !important; border-top:1px solid rgba(255,255,255,.12);}
  .row:active,.team-btn:active,.key:active,.chip:active,.btn:active{transform:scale(.97); transition:transform .12s ease;}
  /* keterbacaan: bayangan halus di semua tulisan di atas kaca/latar, kecuali di atas tombol/pill terang */
  body{text-shadow:0 1px 2px rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.28);}
  .btn-primary,.btn-primary *,.chip.active,.btn-ok,.btn-danger,.btn-warn,.pill,.tag,.toast,.qr-card,.qr-card *,.pick,.pick *,.stk,.stk *,.sheet-page,.pdf-sheet,.pdf-sheet *,.scan-manual input,.field input,.field select,select,textarea{text-shadow:none;}
  .sub,.faint,.lbl,.meta,.empty{color:var(--ink-dim);}
  .tabbtn{color:var(--ink-dim);}
  .pill-neutral{background:rgba(255,255,255,.14); color:var(--ink);}
  .tag{background:rgba(255,255,255,.14); color:var(--ink);}
  .field input,.field select,.searchbar input,.qr-tools select,.opt select,.evkonf-ctl select{background:rgba(255,255,255,.06) !important; color:var(--ink) !important;}
  select option{background:#1A1B1F; color:#F2F2F3;}
  button,input,select{font-family:inherit; font-size:16px;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}
  main{padding:18px 0 72px;}

  .topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .topbar-inner{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .brand{display:flex; align-items:center; gap:8px; color:var(--accent); flex:1; min-width:0;}
  .brand b{font-family:var(--font-display); font-size:1.05rem; letter-spacing:.03em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .userchip{font-size:.8rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw;}
  .tabbar{display:flex; gap:2px; max-width:720px; margin:0 auto; padding:0 10px; overflow-x:auto;}
  .tabbtn{appearance:none; border:none; background:none; padding:10px 12px; min-height:44px; font-family:var(--font-display); font-size:.92rem; letter-spacing:.02em; color:var(--ink-dim); border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer;}
  .tabbtn.active{color:var(--ink); border-bottom-color:var(--accent);}

  .btn{appearance:none; border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px; min-height:44px; font-weight:600; font-size:.95rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; touch-action:manipulation; transition:transform .06s ease, opacity .15s;}
  .btn:active{transform:scale(.98);}
  a.btn{text-decoration:none;}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ok{background:var(--ok); color:#0E1A12;}
  .btn-warn{background:var(--warn); color:#241a05;}
  .btn-danger{background:var(--danger); color:#2A0E0B;}
  .btn-ghost{background:var(--surface-2); color:var(--ink); border-color:var(--line);}
  .btn-outline{background:transparent; color:var(--accent); border-color:var(--accent);}
  .btn-sm{padding:6px 12px; min-height:38px; font-size:.85rem;}
  .btn-block{width:100%;}
  .btn-xl{width:100%; min-height:64px; font-family:var(--font-display); font-size:1.35rem; letter-spacing:.06em; border-radius:var(--radius);}
  .linkbtn{appearance:none; border:none; background:none; color:var(--ink-dim); text-decoration:underline; font-size:.85rem; padding:6px; cursor:pointer;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .section{margin-bottom:26px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .section-head h2{font-size:1.12rem;}
  .sub{color:var(--ink-dim); font-size:.86rem;}
  .faint{color:var(--ink-faint); font-size:.8rem;}
  .mono{font-family:var(--font-mono);}
  .empty{color:var(--ink-faint); font-size:.9rem; padding:14px; text-align:center;}

  .pill{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:.74rem; font-weight:600; white-space:nowrap;}
  .pill-ok{background:var(--ok-soft); color:var(--ok-ink);}
  .pill-info{background:var(--info-soft); color:var(--info-ink);}
  .pill-danger{background:var(--danger-soft); color:var(--danger-ink);}
  .pill-warn{background:var(--warn-soft); color:var(--warn-ink);}
  .pill-neutral{background:var(--surface-2); color:var(--ink-dim);}
  .tag{font-family:var(--font-mono); font-size:.72rem; background:var(--surface-2); color:var(--ink-dim); padding:1px 6px; border-radius:5px;}

  .banner{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-sm); font-size:.92rem;}
  .banner p{margin:0 0 4px;} .banner p:last-child{margin:0;}
  .banner svg{flex:none; margin-top:2px;}
  .banner.ok{background:var(--ok-soft); color:var(--ok-ink);}
  .banner.info{background:var(--info-soft); color:var(--info-ink);}
  .banner.danger{background:var(--danger-soft); color:var(--danger-ink);}
  .banner.warn{background:var(--warn-soft); color:var(--warn-ink);}
  .stack{display:flex; flex-direction:column; gap:10px;}

  /* login */
  .screen-center{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;}
  .login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:28px 24px;}
  .login-mark{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px; color:var(--accent); text-align:center;}
  .login-mark h1{font-size:1.45rem; color:var(--ink);}
  .login-mark span{font-size:.78rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.12em;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.76rem; font-weight:600; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
  .field input,.field select{width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; min-height:44px;}
  .field input:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field input.pin{font-family:var(--font-mono); letter-spacing:.5em; font-size:1.3rem; text-align:center;}
  .form-error{background:var(--danger-soft); color:var(--danger-ink); border-radius:var(--radius-sm); padding:9px 12px; font-size:.86rem; margin-bottom:14px;}
  .scan-hint{background:var(--accent-soft); color:var(--accent-soft-ink); border-radius:var(--radius-sm); padding:10px 12px; font-size:.88rem; margin-bottom:16px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap;}
  /* login cepat: ketuk nama + PIN */
  .step-title{font-family:var(--font-display); font-size:1.05rem; text-align:center; margin:0 0 12px;}
  .team-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .team-btn{appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:var(--radius); padding:12px 10px; min-height:64px; font-weight:600; font-size:.92rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; touch-action:manipulation;}
  .team-btn:active{transform:scale(.97);}
  .team-btn .av{width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:.95rem;}
  .team-btn.last{border-color:var(--accent); background:var(--accent-soft);}
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:6px 0 16px;}
  .pin-dots i{width:16px; height:16px; border-radius:50%; border:2px solid var(--accent); display:block;}
  .pin-dots i.on{background:var(--accent);}
  .pin-dots.shake{animation:shake .35s;}
  @keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .key{appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:var(--radius); min-height:58px; font-family:var(--font-mono); font-size:1.5rem; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  .key:active{background:var(--accent-soft);}
  .key.fn{font-family:var(--font-body); font-size:.85rem; font-weight:600; color:var(--ink-dim);}
  .who-line{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
  .login-qr{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .login-qr .qr-card .cta{color:#B23A3A;}
  .form-row .field{flex:1; min-width:140px;}

  /* tool landing page */
  .tool-hero{padding:20px 18px;}
  .tool-hero .meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .tool-hero h1{font-size:1.7rem; line-height:1.15;}
  .tool-hero .idline{font-family:var(--font-mono); color:var(--ink-faint); font-size:.85rem; margin-top:4px;}
  .status-box{margin:18px 0 16px;}
  .elapsed{font-family:var(--font-mono); font-size:2rem; font-weight:600; color:var(--accent); line-height:1.1; margin-top:6px;}
  .result-note{margin-top:14px;}
  .glist{display:flex; flex-direction:column; gap:6px;}
  .gitem{display:flex; align-items:center; gap:12px; margin:0; border-width:2px;}
  .gitem.on{border-color:var(--accent); background:var(--accent-soft);}
  .gitem.scanned .nm{color:var(--accent-soft-ink);}
  .gtick{flex:none; width:26px; height:26px; border-radius:7px; border:2px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent-ink);}
  .gitem.on .gtick{background:var(--accent); border-color:var(--accent);}

  /* lists */
  .row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:8px;}
  .row .grow{flex:1; min-width:0;}
  .row .nm{font-weight:600;}
  .row .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:3px; font-size:.8rem; color:var(--ink-faint);}
  button.row{width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;}
  .gedung-heading{font-family:var(--font-display); font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:16px 0 8px;}
  .searchbar input{width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; margin-bottom:10px;}
  .chiprow{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--ink-dim); padding:7px 14px; min-height:36px; border-radius:999px; font-size:.84rem; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  details.hist{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
  details.hist summary{padding:12px 14px; cursor:pointer; font-weight:600; font-size:.92rem;}
  .hrow{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-top:1px solid var(--line); font-size:.86rem;}
  .hrow .r{text-align:right; flex:none; font-family:var(--font-mono); color:var(--ink-dim); font-size:.8rem;}

  /* admin */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat .num{font-family:var(--font-mono); font-size:1.7rem; font-weight:600; line-height:1;}
  .stat .lbl{font-size:.78rem; color:var(--ink-dim); margin-top:6px;}
  .stat.ok .num{color:var(--ok);} .stat.info .num{color:var(--info);} .stat.danger .num{color:var(--danger);} .stat.warn .num{color:var(--warn);}
  .tbl{width:100%; border-collapse:collapse; font-size:.85rem;}
  .tbl th,.tbl td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
  .tbl th{font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;}
  .tbl td.num{text-align:right; font-family:var(--font-mono);}
  .scroll-x{overflow-x:auto;}

  /* qr */
  .qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .qr-card{border:1px solid var(--line); border-radius:var(--radius); background:#fff; color:#111; padding:12px; text-align:center;}
  .qr-card .qbox{width:132px; height:132px; margin:0 auto 8px;}
  .qr-card .qbox img{width:132px !important; height:132px !important; image-rendering:pixelated; display:block;}
  .qr-card .nm{font-weight:700; font-size:.82rem; line-height:1.2;}
  .qr-card .id{font-family:var(--font-mono); font-size:.72rem; color:#555; margin-top:2px;}
  .qr-card .cta{font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:#1F5A73; font-weight:700; margin-top:6px;}

  /* toast & loading */
  #toast-host{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; pointer-events:none; width:max-content; max-width:92vw;}
  .toast{background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:.88rem; box-shadow:var(--shadow); text-align:center;}
  .loading{display:flex; align-items:center; justify-content:center; gap:10px; padding:40px 0; color:var(--ink-dim); font-size:.9rem;}
  .spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- cetak QR: pilih + atur lembar ---- */
  .steps{display:flex; gap:6px; margin-bottom:12px;}
  .steps button{flex:1; appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-dim); border-radius:var(--radius-sm); padding:10px 8px; min-height:44px; font-weight:600; font-size:.88rem; cursor:pointer;}
  .steps button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .qr-tools{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:8px;}
  .qr-tools .searchbar{flex:1; min-width:180px;}
  .qr-tools .searchbar input{margin-bottom:0;}
  .qr-tools label, .opt label.lbl{display:block; font-size:.72rem; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
  .qr-tools select, .opt select{padding:10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); min-height:44px; font-size:16px;}
  .filter-label{font-size:.72rem; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin:6px 0 4px;}
  .bulk{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px;}
  .pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; padding-bottom:80px;}
  .pick{position:relative; border:2px solid var(--line); border-radius:var(--radius); background:#fff; color:#111; padding:10px 8px 8px; text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none;}
  .pick.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .pick .tick{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:6px; border:2px solid #B9B3A8; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:15px;}
  .pick.on .tick{background:var(--accent); border-color:var(--accent);}
  .pick img{width:96px; height:96px; image-rendering:pixelated; display:block; margin:0 auto 6px;}
  .pick .nm{font-weight:700; font-size:.8rem; line-height:1.2;}
  .pick .id{font-family:var(--font-mono); font-size:.7rem; color:#555; margin-top:2px;}
  .pick .png{appearance:none; border:none; background:none; color:#1F5A73; text-decoration:underline; font-size:.72rem; margin-top:4px; cursor:pointer; padding:4px;}
  .pickbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(0,0,0,.08);}
  .pickbar .inner{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .pickbar .cnt{flex:1; font-weight:600; font-size:.92rem;}
  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:10px;}
  .opt .chk{display:flex; align-items:center; gap:8px; min-height:44px; font-size:.9rem;}
  .opt .chk input{width:20px; height:20px;}
  .sheet-info{margin:4px 0 12px;}
  .sheet-preview{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px; overflow:hidden;}
  .page-wrap{position:relative; box-shadow:0 1px 4px rgba(0,0,0,.25); background:#fff; flex:none;}
  .page-wrap .page-no{position:absolute; top:-1px; right:-1px; background:var(--ink); color:var(--bg); font-size:.7rem; padding:2px 6px; border-radius:0 0 0 6px; z-index:2;}
  .sheet-page{position:relative; background:#fff; color:#111; overflow:hidden; transform-origin:0 0;}
  .stk{position:absolute; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; text-align:center; font-family:Helvetica, Arial, sans-serif; overflow:hidden;}
  .stk.cut{outline:0.3mm solid #8a8a8a; outline-offset:-0.15mm;}
  .stk img{display:block; image-rendering:pixelated; flex:none;}
  .stk .s-nm{font-weight:700; line-height:1.15; margin-top:0.6mm; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;}
  .stk .s-id{font-family:Menlo, Consolas, monospace; color:#333; line-height:1.25;}
  .stk .s-cta{font-weight:700; color:#1F5A73; letter-spacing:.04em; line-height:1.3;}
  .sel-list .row{padding:8px 10px; gap:8px;}
  .size-ctl{display:flex; align-items:center; gap:4px; flex:none;}
  .size-ctl button{appearance:none; width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:1.1rem; font-weight:700; cursor:pointer;}
  .size-ctl input{width:58px; text-align:center; padding:6px 4px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; min-height:36px;}
  .size-ctl .u{font-size:.75rem; color:var(--ink-faint);}
  .rm{appearance:none; border:none; background:none; color:var(--danger); font-size:1.2rem; width:32px; height:36px; cursor:pointer; flex:none;}
  /* ---- scan QR ---- */
  .scan-overlay{position:fixed; inset:0; z-index:100; background:#000; color:#fff;}
  .scan-overlay video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .scan-frame{position:absolute; left:50%; top:45%; width:min(68vw,300px); aspect-ratio:1; transform:translate(-50%,-50%); border:3px solid rgba(255,255,255,.9); border-radius:18px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45);}
  .scan-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; font-family:var(--font-display); font-size:1.1rem; letter-spacing:.04em;}
  .scan-bottom{position:absolute; bottom:0; left:0; right:0; padding:14px 16px calc(env(safe-area-inset-bottom) + 18px); background:linear-gradient(transparent, rgba(0,0,0,.75) 30%); text-align:center;}
  .scan-bottom p{margin:0 0 10px; font-size:.95rem;}
  .scan-manual{display:flex; gap:8px; max-width:420px; margin:0 auto;}
  .scan-manual input{flex:1; min-width:0; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:#fff; font-size:16px;}
  .scan-manual input::placeholder{color:rgba(255,255,255,.7);}
  .evkonf{margin-top:14px; padding:12px; border:1px dashed var(--warn); border-radius:var(--radius); background:var(--warn-soft);}
  .evkonf-item{padding:10px 0; border-top:1px solid var(--line);} .evkonf-item:first-of-type{border-top:none;}
  .evkonf-ctl{display:grid; grid-template-columns:1fr; gap:6px;} @media (min-width:560px){ .evkonf-ctl{grid-template-columns:2fr 1fr 2fr;} }
  .selrow{cursor:pointer;} .selrow .tick{flex:0 0 26px; width:26px; height:26px; border-radius:7px; border:2px solid rgba(255,255,255,.38); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent-ink); font-size:15px; text-shadow:none;}
  .selrow.on{box-shadow:inset 0 0 0 2px var(--accent);} .selrow.on .tick{background:var(--accent); border-color:var(--accent);}
  .nav-dot{position:absolute; top:3px; right:5px; color:#FFD66B; font-size:12px; line-height:1; text-shadow:0 0 7px rgba(255,214,107,.85) !important; pointer-events:none;}
  .nav-it.on .nav-dot{color:#7A4E00; text-shadow:none !important;}
  .kelsel{padding:4px 6px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.06) !important; color:var(--ink) !important; font-size:14px; min-height:32px;}
  .evsaran{font-size:.78rem; color:var(--ink-dim); margin:6px 0 0;} .evsaran b{color:var(--accent);}
  .evcek ul{margin:6px 0 0 18px; padding:0;} .evcek li{margin:3px 0;}
  .evkonf-ctl select{padding:9px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; min-height:42px;}
  #print-area{display:none;}
  /* ---- evaluasi ---- */
  .evcard{margin-bottom:16px;}
  .evscore{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .evscore .big{font-size:2.8rem; font-weight:600; line-height:1;}
  .evstats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); margin-bottom:14px;}
  .evstats .num{font-size:1.35rem;}
  .evgrid{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:6px;}
  @media (min-width:640px){ .evgrid{grid-template-columns:1fr 1fr;} }
  .evh{font-size:.95rem; margin:16px 0 8px; color:var(--ink-dim); letter-spacing:.03em;}
  .evbars{display:flex; flex-direction:column; gap:6px;}
  .evbar{display:grid; grid-template-columns:minmax(90px,38%) 1fr 34px; align-items:center; gap:8px; font-size:.8rem;}
  .evbar .lbl{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .evbar .trk{display:flex; height:12px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .evbar .n{text-align:right; color:var(--ink-dim);}
  .evbars i, .evlegend i{display:block; height:100%;}
  i.maj{background:var(--danger);} i.sed{background:var(--warn);} i.min{background:var(--accent);}
  .evlegend{display:flex; gap:12px; font-size:.72rem; color:var(--ink-faint); margin-top:4px;}
  .evlegend span{display:flex; align-items:center; gap:4px;} .evlegend i{width:10px; height:10px; border-radius:3px;}
  .evnum{flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display);}
  .evquote{margin:6px 0; padding:8px 10px; border-left:3px solid var(--line); background:var(--surface-2); border-radius:0 6px 6px 0; font-size:.86rem;}
  .evtip{margin-top:6px; padding:8px 10px; background:var(--ok-soft); color:var(--ok-ink); border-radius:var(--radius-sm); font-size:.86rem;}
  .evlist{margin:0; padding-left:20px; font-size:.9rem;} .evlist li{margin-bottom:4px;}
  .evvideo{position:relative; width:100%; max-width:360px; margin:0 auto; aspect-ratio:9/16; background:#000; border-radius:var(--radius-sm); overflow:hidden;}
  .evvideo iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}


  /* ===== layout: navigasi ikon ===== */
  .brand{gap:10px;}
  .brand-t{display:flex; flex-direction:column; line-height:1.05; min-width:0;}
  .brand-t small{font-size:.62rem; letter-spacing:.22em; color:var(--ink-faint); font-weight:600;}
  .brand-t b{font-size:.9rem !important; letter-spacing:.06em !important;}
  .brand-full{display:none;}
  @media (max-width: 479px){ .brand > svg{display:none;} .brand-t b{font-size:.78rem !important; letter-spacing:.02em !important;} .topbar-inner{gap:8px; padding:10px 12px;} }
  .userchip{display:inline-flex; align-items:center; gap:8px; max-width:none;}
  .userchip .av, .evperson .av{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); display:inline-flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:700; color:var(--ink); flex:none;}
  .nav{position:fixed; z-index:40; display:flex; -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(14,16,21,.55) 45%, rgba(14,16,21,.5)); border:1px solid rgba(255,255,255,.16); box-shadow:var(--lg-shadow);}
  .nav-it{appearance:none; border:0; background:transparent; color:var(--ink-dim); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative; flex:none;
    border-radius:16px; transition:color .18s ease, background .18s ease, transform .18s ease;}
  .nav-it:hover{color:var(--ink); background:rgba(255,255,255,.07);}
  .nav-it:active{transform:scale(.92);}
  .nav-it.on{color:var(--accent-ink); background:linear-gradient(180deg, rgba(232,218,192,.96), rgba(214,196,163,.86)); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(214,196,163,.25);}
  .nav-it:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .nav-it.on *{text-shadow:none;}
  .nav-lbl{font-size:.62rem; font-weight:600; letter-spacing:.01em; white-space:nowrap; text-shadow:none;}
  /* HP (vertikal): dock bawah, ikon saja */
  @media (max-width: 899px){
    .nav{left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 10px); border-radius:24px; padding:6px; gap:2px; overflow-x:auto; scrollbar-width:none; justify-content:space-between;}
    .nav::-webkit-scrollbar{display:none;}
    .nav-it{width:40px; height:44px; min-width:40px;}
    .nav-lbl{display:none;}
    main.has-nav{padding-bottom:110px;}
    #toast-host{bottom:calc(env(safe-area-inset-bottom) + 86px);}
    .hide-xs{display:none;}
  }
  @media (max-width: 419px){ .nav{padding:5px; left:8px; right:8px;} .nav-it{width:35px; min-width:35px;} .seg button{padding:8px 10px;} }
  @media (max-width: 899px) and (min-width: 480px){ .nav{left:50%; right:auto; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 20px);} .nav-it{width:48px;} .hide-xs{display:inline;} }
  /* komputer (landscape): sidebar kiri, ikon + label, konten lebih lebar */
  @media (min-width: 900px){

  #content{animation:pagein .28s ease both;}

  .subtabs{margin-top:-4px;}

  .evsel-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .evperson-h .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:3px;}
  .evperson .av{width:36px; height:36px; font-size:.8rem;}
  .ring{--p:0; --c:var(--accent); width:84px; height:84px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(closest-side, rgba(14,16,21,.92) 78%, transparent 80% 100%), conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.1) 0);}
  .ring span{font-size:1.45rem; font-weight:600;}
  .evscore .grow{flex:1; min-width:0;}
  .evvids{margin-top:14px;} .evvids .tbl td:first-child{min-width:180px;}
  .tbl tr.me{background:var(--accent-soft);}

  .medal.m1{background:linear-gradient(160deg,#F3E2A9,#C9A54B);} .medal.m2{background:linear-gradient(160deg,#ECEEF2,#A9AEB8);} .medal.m3{background:linear-gradient(160deg,#E9C3A1,#A86E45);}
  /* mading */
  .mboard{columns:1; column-gap:14px;}
  @media (min-width: 640px){ .mboard{columns:2;} }
  @media (min-width: 1100px){ .mboard{columns:3;} }
  .mcard{break-inside:avoid; position:relative; margin:0 0 16px; padding:20px 16px 14px; border-radius:var(--radius); transform:rotate(var(--tilt)); transition:transform .2s ease, box-shadow .2s ease;
    -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); background:var(--lg-fill); border:1px solid rgba(255,255,255,.14); box-shadow:var(--lg-shadow);}

  .mfoot{margin-top:8px;}

  .mklist{margin-top:6px;}
  .mk{padding:8px 0; border-top:1px solid rgba(255,255,255,.06);} .mk:first-child{border-top:none;}
  .mk.sub{margin-left:28px; padding-left:10px; border-left:2px solid var(--line); border-top:none;}
  .mk-h{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.84rem;}

  .mk-isi{white-space:pre-line; font-size:.9rem; margin:4px 0 0 28px;}
  .mk-act{display:flex; gap:12px; margin:4px 0 0 28px; font-size:.8rem;}
  .mk-to{margin:8px 0 4px; font-size:.82rem;}
  .mk-in{display:flex; gap:8px; align-items:flex-end; margin-top:8px;}
  .mk-in textarea{flex:1; min-height:44px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--ink); font:inherit; font-size:16px; resize:vertical;}
  /* fitur yang sedang dibuat */
  .soon{text-align:center; padding:34px 20px; max-width:620px; margin:0 auto;}
  .soon-ic{width:84px; height:84px; margin:0 auto 14px; border-radius:26px; display:flex; align-items:center; justify-content:center; color:var(--accent);
    background:linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 1px 1px rgba(255,255,255,.3); animation:float 4s ease-in-out infinite;}
  @keyframes float{50%{transform:translateY(-6px);}}
  .soon h2{font-size:1.25rem; margin-bottom:6px;}
  .soon .evlist{display:inline-block; text-align:left; margin:8px 0 16px;}
  @media print{
    .no-print{display:none !important;}
    #toast-host{display:none !important;}
    body{background:#fff;}
    main{padding:0;}
    .qr-grid{grid-template-columns:repeat(3,1fr); gap:8px;}
    .qr-card{break-inside:avoid; border:1px dashed #999; box-shadow:none;}
    /* lembar cetak QR: hanya halaman yang disusun admin yang tercetak, ukuran asli (mm) */
    body.print-sheet #root{display:none !important;}
    body.print-sheet #print-area{display:block !important;}
    body.print-sheet .sheet-page{transform:none !important; page-break-after:always; break-after:page; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body.print-sheet .sheet-page:last-child{page-break-after:auto; break-after:auto;}
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  /* ===== Working Space (chat) ===== */
  #content[data-page="ws"]{max-width:1180px;}
  .ws{display:grid; grid-template-columns:330px minmax(0,1fr); gap:14px; height:calc(100dvh - var(--tb,62px) - 40px); min-height:420px;}
  .ws-side,.ws-main{position:relative; display:flex; flex-direction:column; min-height:0; overflow:hidden; border-radius:var(--radius); background:var(--lg-fill); border:1px solid rgba(255,255,255,.14); box-shadow:var(--lg-shadow); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);}
  .ws-side-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 12px 6px;}

  .ws-hbtn{min-width:38px; padding:6px 9px !important; gap:1px;}

  .ws-search input{width:100%; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--ink);}
  .ws-items,.ws-people{overflow-y:auto; flex:1; padding:0 6px 8px;}
  .ws-item{appearance:none; display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; border:0; border-radius:14px; background:none; color:inherit; text-align:left; cursor:pointer; font:inherit;}
  .ws-item:hover{background:rgba(255,255,255,.06);} .ws-item.on{background:rgba(255,255,255,.12);}

  .ws-av.g{background:var(--accent-soft); color:var(--accent-soft-ink); border-color:rgba(214,196,163,.35);}
  .ws-av.l{width:60px; height:60px; font-size:1.1rem;}
  .ws-head{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); min-height:62px;}

  .ws-title b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ws-title small{color:var(--ink-faint); font-size:.74rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .ws-msgs{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:2px; overscroll-behavior:contain;}
  .ws-day{text-align:center; margin:12px 0 6px;} .ws-day span{font-size:.72rem; color:var(--ink-dim); background:rgba(255,255,255,.08); padding:3px 10px; border-radius:999px;}
  .ws-e2e{align-self:center; max-width:460px; text-align:center; font-size:.76rem; color:var(--warn-ink); background:var(--warn-soft); border-radius:12px; padding:8px 12px; margin:4px 0 10px;}
  .ws-more{text-align:center; margin:4px 0 8px;}

  .ws-doc b{display:block; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .ws-doc small{color:var(--ink-faint); font-size:.72rem;} .ws-doc .grow{min-width:0; flex:1;}

  .ws-lock{max-width:440px; margin:0 auto; text-align:center;}
  .ws-lock-ic{width:60px; height:60px; margin:4px auto 10px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent);}
  .ws-lock h2{margin-bottom:6px;} .ws-lock form{margin-top:14px; text-align:left;}
  .ws-ingat{display:flex; gap:8px; align-items:center; font-size:.86rem; color:var(--ink-dim); margin:0 0 12px;}
  .ws-ingat input{width:18px; height:18px;}
  .push-card{margin-top:14px; text-align:left; width:100%;}
  .ws-view{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;}
  .ws-view img{max-width:100%; max-height:calc(100vh - 90px); object-fit:contain;}
  .ws-view-bar{display:flex; gap:8px; align-items:center; margin-top:10px; color:#ddd; font-size:.85rem; max-width:100%;} .ws-view-bar span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #ws-pop-host{position:fixed; right:16px; top:calc(var(--tb,62px) + 10px); z-index:75; display:flex; flex-direction:column; gap:8px; width:min(360px, calc(100vw - 24px)); pointer-events:none;}
  .ws-pop{pointer-events:auto; position:relative; border-radius:18px; padding:10px; background:rgba(26,27,31,.94); border:1px solid rgba(255,255,255,.16); box-shadow:0 18px 40px rgba(0,0,0,.5); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); animation:popin .25s ease;}
  @keyframes popin{from{opacity:0; transform:translateY(-10px) scale(.98);}}
  .ws-pop-main{appearance:none; display:flex; gap:10px; align-items:center; width:100%; border:0; background:none; color:inherit; text-align:left; cursor:pointer; padding:0 22px 0 0; font:inherit;}
  .ws-pop-main .grow{min-width:0; display:flex; flex-direction:column;} .ws-pop-main .grow > span{color:var(--ink-dim); font-size:.86rem; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .ws-pop-x{position:absolute; top:6px; right:8px; appearance:none; border:0; background:none; color:var(--ink-faint); font-size:20px; cursor:pointer; line-height:1;}
  .ws-pop-rep{display:flex; gap:6px; margin-top:8px;} .ws-pop-rep input{flex:1; min-width:0; padding:8px 12px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.07); color:var(--ink); font-size:16px;}
  @media (max-width:899px){
    .ws{grid-template-columns:minmax(0,1fr); height:calc(100dvh - var(--tb,62px) - 128px);}
    .ws .ws-main{display:none;} .ws.in-chat .ws-side{display:none;} .ws.in-chat .ws-main{display:flex;}
    .ws-back{display:inline-flex;}
    body.ws-chat .nav{display:none;}
    body.ws-chat main.has-nav{padding:0 !important;}
    body.ws-chat #content{padding:0;}
    body.ws-chat .ws{height:calc(100dvh - var(--tb,62px)); gap:0;}
    body.ws-chat .ws-main{border-radius:0; border-left:0; border-right:0; border-bottom:0;}
    #ws-pop-host{left:12px; right:12px; width:auto;}
    .wsm{max-width:86%;}
  }
  /* ===== Aplikasi (PWA): lembar Pasang, banner versi baru, status offline ===== */
  .app-overlay{position:fixed; inset:0; z-index:80; background:rgba(5,6,8,.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-bottom:calc(env(safe-area-inset-bottom) + 16px); overflow-y:auto;}
  @media (min-width:640px){ .app-overlay{align-items:center;} }
  .app-sheet{width:100%; max-width:520px; margin:0 !important; background:var(--surface-solid) !important; animation:pagein .22s ease both;}
  .app-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;}
  .app-head h2{font-size:1.2rem; margin:0;}
  .app-head .sub{margin:4px 0 0;}
  .app-os{display:flex; width:100%; margin-bottom:12px;}
  .app-os button{flex:1;}
  .app-sheet .banner{margin-bottom:12px;}
  .app-sheet #app-instal{margin-bottom:12px;}
  .app-sub{font-size:.95rem; margin:4px 0 8px;}
  .app-steps{margin:0 0 12px; padding-left:22px; display:grid; gap:8px; line-height:1.45;}
  .app-steps li::marker{color:var(--accent); font-weight:700;}
  .app-sheet .faint{margin:0 0 6px; font-size:.82rem;}
  .app-login-link{text-align:center; margin:14px 0 0;}
  .app-login-link .linkbtn{display:inline-flex; align-items:center; gap:6px;}
  .app-update,.app-offline{position:fixed; left:50%; transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; border-radius:16px; border:1px solid var(--line); background:var(--surface-solid); box-shadow:0 10px 30px rgba(0,0,0,.45); font-size:.88rem; max-width:calc(100vw - 24px);}
  .app-update{top:calc(env(safe-area-inset-top) + 70px);}
  .app-offline{top:calc(env(safe-area-inset-top) + 70px); padding:10px 16px; color:#F6C9A0; border-color:rgba(240,138,128,.35);}
</style>

  function render(){
    var root = document.getElementById('root');
    if (!auth) { root.innerHTML = renderLogin(); bindLogin(); return; }
    var nav = view === 'home';
    root.innerHTML = renderTopbar() + (nav ? renderNav() : '') + '<main class="' + (nav ? 'has-nav' : '') + '"><div class="wrap' + (nav ? ' wide' : '') + '" id="content" data-page="' + esc(view === 'tool' ? 'tool' : tab) + '">' + (view === 'tool' ? renderTool() : renderHome()) + '</div></main>';
    bindTopbar();
    if (view === 'tool') bindTool(); else bindHome();
    wsBodyClass();
  }

  /* ---------- login (cepat: ketuk nama -> 4 digit PIN, otomatis masuk) ---------- */
  function initials(n){ var w = String(n || '?').trim().split(/\s+/); return ((w[0] || '?').charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase(); }
  function scanHintHtml(){
    if (!BOOT.toolId) return '';
    return '<div class="scan-hint" id="scan-hint">' + (BOOT.tool ? 'Alat: <strong>' + esc(BOOT.tool.nama) + '</strong> &middot; Gedung ' + esc(BOOT.tool.gedung) : 'Alat: <strong>' + esc(BOOT.toolId) + '</strong>') + '</div>';
  }
  function renderLogin(){
    var head = '<div class="login-mark" style="margin-bottom:14px;">' + ICON.mark + '<h1>DASHBOARD VIDEOGRAPHER &amp; EDITOR</h1></div>';
    var body;
    if (lg.linking) {
      body = loadingHtml('Menyambungkan akun ke HP ini…');
    } else if (lg.manual || lg.teamFailed) {
      body = '<form id="login-form" autocomplete="on">'
        + '<div class="field"><label for="f-username">Username</label><input id="f-username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required value="' + esc(lastUser()) + '"></div>'
        + '<div class="field"><label for="f-pin">PIN (4 digit)</label><input id="f-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" required></div>'
        + '<button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button></form>'
        + (lg.team ? '<p style="text-align:center; margin:12px 0 0;"><button type="button" class="linkbtn" id="btn-to-team">Pilih nama saja</button></p>' : '');
    } else if (!lg.team) {
      body = loadingHtml('Memuat daftar tim…');
    } else if (!lg.pick) {
      var last = lastUser();
      var team = lg.team.slice().sort(function(a, b){ return (b.username === last) - (a.username === last); });
      body = '<p class="step-title">Siapa kamu?</p><div class="team-grid">'
        + team.map(function(m){
            return '<button type="button" class="team-btn' + (m.username === last ? ' last' : '') + '" data-pick="' + esc(m.username) + '"><span class="av">' + esc(initials(m.nama)) + '</span>' + esc(m.nama) + '</button>';
          }).join('')
        + '</div>';
    } else {
      var dots = '';
      for (var i = 0; i < 4; i++) dots += '<i class="' + (i < lg.pin.length ? 'on' : '') + '"></i>';
      var keys = ['1','2','3','4','5','6','7','8','9','back','0','del'].map(function(k){
        if (k === 'back') return '<button type="button" class="key fn" data-key="back">Ganti<br>nama</button>';
        if (k === 'del') return '<button type="button" class="key fn" data-key="del" aria-label="Hapus">&#9003;</button>';
        return '<button type="button" class="key" data-key="' + k + '">' + k + '</button>';
      }).join('');
      body = '<div class="who-line"><span class="team-btn" style="min-height:0; padding:0; border:none; background:none; flex-direction:row;"><span class="av">' + esc(initials(lg.pick.nama)) + '</span><strong>' + esc(lg.pick.nama) + '</strong></span></div>'
        + '<p class="step-title" style="margin-bottom:6px;">' + (lg.checking ? 'Memeriksa…' : 'Masukkan PIN') + '</p>'
        + '<div class="pin-dots" id="pin-dots">' + dots + '</div>'
        + '<div class="keypad">' + keys + '</div>';
    }
    return '<div class="screen-center"><div class="login-card">' + head + scanHintHtml()
      + (ui.loginError ? '<div class="form-error" id="login-error">' + esc(ui.loginError) + '</div>' : '')
      + body
      + '<p class="faint" style="text-align:center; margin:16px 0 0;">Cukup <strong>sekali</strong> di HP ini. Setelah itu scan QR alat langsung ke tombol Start / Selesai.</p>'
      + (!lg.manual && !lg.teamFailed && !lg.linking ? '<p style="text-align:center; margin:4px 0 0;"><button type="button" class="linkbtn" id="btn-to-manual">Login pakai username</button></p>' : '')
      + '</div>' + appLinkLogin() + '</div>';
  }
  function updatePinDots(){
    var d = document.getElementById('pin-dots'); if (!d) return;
    Array.prototype.forEach.call(d.children, function(el, i){ el.className = i < lg.pin.length ? 'on' : ''; });
  }
  function pressKey(k){
    if (!lg.pick || lg.checking) return;
    if (k === 'back') { lg.pick = null; lg.pin = ''; ui.loginError = ''; render(); return; }
    if (k === 'del') { lg.pin = lg.pin.slice(0, -1); updatePinDots(); return; }
    if (!/^[0-9]$/.test(k) || lg.pin.length >= 4) return;
    lg.pin += k; updatePinDots();
    if (lg.pin.length === 4) doLogin(lg.pick.username, lg.pin);
  }
  function afterLogin(){
    ui.loginError = ''; lg.pick = null; lg.pin = ''; lg.checking = false; lg.manual = false;
    if (view === 'tool') { render(); refreshTool(); }
    else { tab = isAdmin() ? 'admin' : 'saya'; render(); loadTab(); }
  }
  function doLogin(username, pin){
    if (busy) return;
    busy = true; lg.checking = true;
    if (lg.pick) render();
    call('apiLogin', username, pin).then(function(res){
      busy = false; lg.checking = false;
      if (!res.ok) {
        ui.loginError = res.message || 'Login gagal.'; lg.pin = ''; render();
        var d = document.getElementById('pin-dots'); if (d) d.classList.add('shake');
        return;
      }
      saveAuth({ token: res.token, user: res.user });
      afterLogin();
    });
  }
  function bindLogin(){
    document.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', function(){
        var u = b.getAttribute('data-pick');
        lg.pick = lg.team.filter(function(m){ return m.username === u; })[0] || null; lg.pin = ''; ui.loginError = ''; render();
      });
    });
    document.querySelectorAll('[data-key]').forEach(function(b){
      b.addEventListener('click', function(){ pressKey(b.getAttribute('data-key')); });
    });
    var tm = document.getElementById('btn-to-manual'); if (tm) tm.addEventListener('click', function(){ lg.manual = true; ui.loginError = ''; render(); });
    var tt = document.getElementById('btn-to-team'); if (tt) tt.addEventListener('click', function(){ lg.manual = false; lg.teamFailed = false; ui.loginError = ''; render(); });
    var f = document.getElementById('login-form');
    if (f) f.addEventListener('submit', function(ev){
      ev.preventDefault();
      var btn = document.getElementById('btn-login'); btn.disabled = true; btn.textContent = 'Memeriksa…';
      doLogin(document.getElementById('f-username').value, document.getElementById('f-pin').value);
    });
  }
  document.addEventListener('keydown', function(ev){
    if (auth || !lg.pick || lg.manual) return;
    if (/^[0-9]$/.test(ev.key)) { pressKey(ev.key); ev.preventDefault(); }
    else if (ev.key === 'Backspace') { pressKey('del'); ev.preventDefault(); }
  });
  function loadTeam(){
    call('apiTeam').then(function(res){
      if (res.ok && res.team && res.team.length) lg.team = res.team; else lg.teamFailed = true;
      if (!auth) render();
    });
  }

  /* ---------- navigasi ikon: dock bawah (HP, vertikal) / sidebar kiri (komputer, landscape) ---------- */
  var NAV_IC = { wlb: 'cup', mading: 'pin', ws: 'chat', alat: 'camera', rapor: 'report', tim: 'trophy', kpi: 'target', kal: 'calendar', adm: 'gear' };
  function navItems(){
    var l = [['wlb', 'Worklife Balance'], ['mading', 'Mading VGE'], ['ws', 'Working Space'], ['alat', 'Alat'], ['rapor', isAdmin() ? 'Admin Rapor' : 'Rapor Ku'],
      ['tim', 'Rapor Tim'], ['kpi', 'Tracking KPI'], ['kal', 'Kalender Konten']];
    if (isAdmin()) l.push(['adm', 'Admin']);
    return l;
  }
  function navKey(t){ return (t === 'saya' || t === 'semua') ? 'alat' : ((t === 'admin' || t === 'qr') ? 'adm' : t); }
  function navTarget(k){ return k === 'alat' ? 'saya' : (k === 'adm' ? 'admin' : k); }
  function ic(name, size){ var s = size || 22; return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATH[name] || '') + '</svg>'; }
  function pageHead(k, title, sub, right){
    var key = NAV_IC[k] ? k : navKey(k);
    return '<div class="pagehead"><div class="pagehead-ic">' + ic(NAV_IC[key] || 'pin', 22) + '</div><div class="grow"><h1>' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + (right || '') + '</div>';
  }
  function subTabs(list){ return '<div class="seg subtabs">' + list.map(function(x){ return '<button type="button" class="' + (tab === x[0] ? 'on' : '') + '" data-tab="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>'; }
  function renderNav(){
    var cur = navKey(tab);
    return '<nav class="nav no-print" aria-label="Menu">' + navItems().map(function(x){
      return '<button type="button" class="nav-it' + (cur === x[0] ? ' on' : '') + '" data-nav="' + x[0] + '" aria-label="' + esc(x[1]) + '" title="' + esc(x[1]) + '"' + (cur === x[0] ? ' aria-current="page"' : '') + '>'
        + ic(NAV_IC[x[0]], 22) + (badges[x[0]] ? '<span class="nav-dot" aria-label="ada info baru">&#9733;</span>' : '') + '<span class="nav-lbl">' + esc(x[1]) + '</span></button>';
    }).join('') + '</nav>';
  }
  function renderTopbar(){
    return '<div class="topbar no-print"><div class="topbar-inner">'
      + (view === 'tool'
          ? '<button type="button" class="btn btn-ghost btn-sm" id="btn-home">' + ICON.back + ' Dashboard</button><div class="brand"></div>'
          : '<div class="brand">' + ICON.mark + '<div class="brand-t"><small>DASHBOARD</small><b title="DASHBOARD VIDEOGRAPHER &amp; EDITOR">VIDEOGRAPHER &amp; EDITOR</b></div><b class="brand-full">DASHBOARD VIDEOGRAPHER &amp; EDITOR</b></div>')
      + appTombolTop()
      + '<button type="button" class="btn btn-primary btn-sm" id="btn-scan-top" aria-label="Scan QR alat">' + ICON.scan + '<span class="hide-xs"> Scan</span></button>'
      + '<span class="userchip" title="' + esc(auth.user.nama) + '"><span class="av">' + esc(initials(auth.user.nama)) + '</span><span class="hide-xs">' + esc(auth.user.nama) + '</span></span>'
      + '<button type="button" class="linkbtn" id="btn-logout">Keluar</button>'
      + '</div></div>';
  }
  function bindTopbar(){
    var sc = document.getElementById('btn-scan-top'); if (sc) sc.addEventListener('click', scanStart);
    var lo = document.getElementById('btn-logout');
    if (lo) lo.addEventListener('click', function(){
      if (!lo.getAttribute('data-armed')) {
        lo.setAttribute('data-armed', '1'); lo.textContent = 'Yakin keluar?';
        setTimeout(function(){ if (lo.isConnected) { lo.removeAttribute('data-armed'); lo.textContent = 'Keluar'; } }, 3000);
        return;
      }
      wsKeluar(); clearAuth(); appBadge(); view = BOOT.toolId ? 'tool' : 'home'; lg.pick = null; lg.pin = ''; render(); if (!lg.team) loadTeam();
    });
    var hb = document.getElementById('btn-home');
    if (hb) hb.addEventListener('click', function(){ view = 'home'; tab = 'saya'; render(); loadTab(); });
    document.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){ var t = navTarget(b.getAttribute('data-nav')); if (t === tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } tab = t; render(); loadTab(); window.scrollTo(0, 0); });
    });
    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ tab = b.getAttribute('data-tab'); render(); loadTab(); });
    });
  }

  /* ---------- halaman paket (mis. battery 5 unit + charger / QR master) ---------- */
  function setGroup(g){
    toolState.group = g || null;
    if (!g || toolState.selInit) return;
    var me = auth && auth.user.id, sel = {};
    var mine = g.items.filter(function(it){ return it.opens.some(function(o){ return o.userId === me; }); });
    var free = g.items.filter(function(it){ return !it.opens.length; });
    if (toolState.toolId === g.masterId) (mine.length ? mine : free).forEach(function(it){ sel[it.tool.id] = 1; });
    else sel[toolState.toolId] = 1;
    toolState.sel = sel; toolState.selInit = true;
  }
  function unitLabel(it, g){
    if (it.tool.id === g.masterId) return 'Charger / paket';
    var m = it.tool.id.match(/-([A-Z]+\d+)$/); return 'Unit ' + (m ? m[1] : it.tool.id);
  }
  function groupCounts(){
    var g = toolState.group, me = auth.user.id, st = 0, sp = 0, ov = 0;
    g.items.forEach(function(it){
      if (!toolState.sel[it.tool.id]) return;
      var mine = it.opens.some(function(o){ return o.userId === me; });
      if (mine) sp++; else { st++; if (it.opens.length) ov++; }
    });
    return { start: st, stop: sp, overlap: ov };
  }
  function renderGroup(){
    var g = toolState.group, me = auth.user.id;
    var master = g.items.filter(function(it){ return it.tool.id === g.masterId; })[0].tool;
    var units = g.items.length - 1;
    var rows = g.items.map(function(it){
      var id = it.tool.id, on = !!toolState.sel[id];
      var mine = it.opens.filter(function(o){ return o.userId === me; })[0];
      var others = it.opens.filter(function(o){ return o.userId !== me; });
      var st;
      if (mine) st = '<span class="pill pill-info">Kamu pakai sejak ' + esc(fmtTime(mine.start)) + ' WIB · ' + esc(fmtDur(mine.start)) + '</span>';
      else if (others.length) st = '<span class="pill pill-danger">Dipakai ' + esc(others.map(function(o){ return o.userNama; }).join(', ')) + ' sejak ' + esc(fmtTime(others[0].start)) + ' WIB</span>';
      else st = '<span class="pill pill-ok">Tersedia</span>';
      if (mine && others.length) st += ' <span class="pill pill-danger">overlap</span>';
      return '<button type="button" class="row gitem' + (on ? ' on' : '') + (id === toolState.toolId ? ' scanned' : '') + '" data-gsel="' + esc(id) + '" role="checkbox" aria-checked="' + on + '">'
        + '<span class="gtick">' + (on ? '&#10003;' : '') + '</span>'
        + '<div class="grow"><div class="nm">' + esc(unitLabel(it, g)) + (id === toolState.toolId ? ' <span class="tag">di-scan</span>' : '') + '</div>'
        + '<div class="meta"><span class="tag">' + esc(id) + '</span>' + st + '</div></div></button>';
    }).join('');
    var c = groupCounts();
    var acts = '';
    if (c.start) acts += '<button type="button" class="btn ' + (c.overlap ? 'btn-warn' : 'btn-ok') + ' btn-xl" id="btn-gstart">START ' + c.start + ' alat' + (c.overlap ? ' (' + c.overlap + ' overlap)' : '') + '</button>';
    if (c.stop) acts += '<button type="button" class="btn btn-danger btn-xl" id="btn-gstop" style="margin-top:10px;">SELESAI ' + c.stop + ' alat</button>';
    if (!acts) acts = '<div class="banner info">' + ICON.info + '<p>Centang unit yang mau dipakai / diselesaikan.</p></div>';
    var note = toolState.note ? '<div class="result-note banner ' + toolState.note.kind + '">' + (toolState.note.kind === 'ok' ? ICON.check : ICON.info) + '<p>' + esc(toolState.note.text) + '</p></div>' : '';
    return '<div class="card tool-hero">'
      + '<div class="meta"><span class="pill pill-neutral">' + esc(master.jenis) + '</span><span class="pill pill-neutral">Gedung ' + esc(master.gedung) + '</span><span class="pill pill-info">Paket · ' + units + ' unit + charger</span></div>'
      + '<h1>' + esc(master.nama) + '</h1><div class="idline">QR master: ' + esc(master.id) + '</div>'
      + '<div class="chiprow" style="margin:14px 0 8px;"><button type="button" class="chip" data-gquick="all">Pilih semua (+ charger)</button>'
      + '<button type="button" class="chip" data-gquick="units">Unit saja</button>'
      + '<button type="button" class="chip" data-gquick="mine">Yang saya pakai</button>'
      + '<button type="button" class="chip" data-gquick="none">Kosongkan</button></div>'
      + '<div class="glist">' + rows + '</div>'
      + '<div style="margin-top:14px;">' + acts + '</div>'
      + note
      + '</div>'
      + '<p class="faint" style="text-align:center; margin-top:14px;">Masuk sebagai ' + esc(auth.user.nama) + '. Scan QR unit mana pun atau QR master di charger untuk membuka halaman ini.</p>';
  }
  function bindGroup(){
    var g = toolState.group, me = auth.user.id;
    document.querySelectorAll('[data-gsel]').forEach(function(b){ b.addEventListener('click', function(){
      var id = b.getAttribute('data-gsel'); if (toolState.sel[id]) delete toolState.sel[id]; else toolState.sel[id] = 1; toolState.note = null; render();
    }); });
    document.querySelectorAll('[data-gquick]').forEach(function(b){ b.addEventListener('click', function(){
      var q = b.getAttribute('data-gquick'), sel = {};
      g.items.forEach(function(it){
        var id = it.tool.id, mine = it.opens.some(function(o){ return o.userId === me; });
        if (q === 'all' || (q === 'units' && id !== g.masterId) || (q === 'mine' && mine)) sel[id] = 1;
      });
      toolState.sel = sel; toolState.note = null; render();
    }); });
    var act = function(kind){
      if (busy || Date.now() < cooldownUntil) return;
      var ids = g.items.filter(function(it){
        if (!toolState.sel[it.tool.id]) return false;
        var mine = it.opens.some(function(o){ return o.userId === me; });
        return kind === 'stop' ? mine : !mine;
      }).map(function(it){ return it.tool.id; });
      if (!ids.length) return;
      busy = true; mutSeq++;
      var btn = document.getElementById(kind === 'stop' ? 'btn-gstop' : 'btn-gstart'); if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; }
      call(kind === 'stop' ? 'apiStopMany' : 'apiStartMany', auth.token, ids, toolState.toolId).then(function(res){
        busy = false; cooldownUntil = Date.now() + 1500;
        var ok = handle(res);
        if (!ok) { if (auth) render(); return; }
        toolState.tool = ok.tool; toolState.opens = ok.opens || []; setGroup(ok.group);
        toolState.note = { kind: ok.already ? 'info' : 'ok', text: ok.message };
        home = null; admin = null;
        render(); toast(ok.message);
      });
    };
    var bs = document.getElementById('btn-gstart'); if (bs) bs.addEventListener('click', function(){ act('start'); });
    var bp = document.getElementById('btn-gstop'); if (bp) bp.addEventListener('click', function(){ act('stop'); });
  }

  /* ---------- tool landing page (hasil scan) ---------- */
  function renderTool(){
    var t = toolState.tool;
    if (!toolState.loaded) return loadingHtml('Memuat data alat…');
    if (t && toolState.group) return renderGroup();
    if (!t) {
      return '<div class="card tool-hero"><div class="banner danger">' + ICON.warn + '<div><p><strong>Alat tidak ditemukan.</strong></p><p>Kode <span class="mono">' + esc(toolState.toolId || '-') + '</span> tidak terdaftar. Hubungi admin.</p></div></div></div>';
    }
    var me = auth.user.id;
    var mine = toolState.opens.filter(function(o){ return o.userId === me; })[0];
    var others = toolState.opens.filter(function(o){ return o.userId !== me; });
    var otherHtml = others.map(function(o){
      return '<p>Sedang dipakai oleh <strong>' + esc(o.userNama) + '</strong> sejak <strong>' + esc(fmtTime(o.start)) + ' WIB</strong>' + (o.overdue ? ' (' + esc(fmtDay(o.start)) + ', belum ditutup)' : '') + ' &middot; ' + esc(fmtDur(o.start)) + '</p>';
    }).join('');

    var statusHtml, actionHtml;
    if (mine) {
      statusHtml = '<div class="banner ok">' + ICON.check + '<div><p>Sedang <strong>Anda pakai</strong> sejak <strong>' + esc(fmtTime(mine.start)) + ' WIB</strong>' + (mine.overdue ? ' (' + esc(fmtDay(mine.start)) + ')' : '') + '</p><div class="elapsed" id="elapsed">' + esc(fmtDur(mine.start)) + '</div></div></div>'
        + (mine.overdue ? '<div class="banner warn" style="margin-top:10px;">' + ICON.warn + '<p>Sesi ini dari hari sebelumnya dan belum ditutup. Tutup sekarang kalau sudah selesai.</p></div>' : '')
        + (others.length ? '<div class="banner danger" style="margin-top:10px;">' + ICON.warn + '<div>' + otherHtml + '</div></div>' : '');
      actionHtml = '<button type="button" class="btn btn-danger btn-xl" id="btn-act" data-act="stop">SELESAI</button>';
    } else if (others.length) {
      statusHtml = '<div class="banner danger">' + ICON.warn + '<div>' + otherHtml + '<p>Anda tetap bisa memakai — sesi ini akan dicatat sebagai <strong>overlap</strong>.</p></div></div>';
      actionHtml = '<button type="button" class="btn btn-warn btn-xl" id="btn-act" data-act="start">START (OVERLAP)</button>';
    } else {
      statusHtml = '<div class="banner ok">' + ICON.check + '<p>Alat <strong>tersedia</strong> dan siap dipakai.</p></div>';
      actionHtml = '<button type="button" class="btn btn-ok btn-xl" id="btn-act" data-act="start">START</button>';
    }
    var note = toolState.note ? '<div class="result-note banner ' + toolState.note.kind + '">' + (toolState.note.kind === 'ok' ? ICON.check : ICON.info) + '<p>' + esc(toolState.note.text) + '</p></div>' : '';

    return '<div class="card tool-hero">'
      + '<div class="meta"><span class="pill pill-neutral">' + esc(t.jenis) + '</span><span class="pill pill-neutral">Gedung ' + esc(t.gedung) + '</span></div>'
      + '<h1>' + esc(t.nama) + '</h1><div class="idline">' + esc(t.id) + '</div>'
      + '<div class="status-box">' + statusHtml + '</div>'
      + actionHtml
      + note
      + '</div>'
      + '<p class="faint" style="text-align:center; margin-top:14px;">Masuk sebagai ' + esc(auth.user.nama) + '. Halaman ini boleh tetap dibuka — tombol Selesai bisa ditekan nanti tanpa scan ulang.</p>';
  }
  function bindTool(){
    if (toolState.group) { bindGroup(); return; }
    var b = document.getElementById('btn-act');
    if (!b) return;
    b.addEventListener('click', function(){
      if (busy || Date.now() < cooldownUntil) return;
      var act = b.getAttribute('data-act');
      busy = true; mutSeq++; b.disabled = true; b.textContent = 'Memproses…';
      call(act === 'stop' ? 'apiStop' : 'apiStart', auth.token, toolState.toolId).then(function(res){
        busy = false; cooldownUntil = Date.now() + 1500;
        var ok = handle(res);
        if (!ok) { if (auth) render(); return; }
        toolState.tool = ok.tool; toolState.opens = ok.opens || []; setGroup(ok.group);
        toolState.note = { kind: ok.already ? 'info' : 'ok', text: ok.message };
        home = null; admin = null;
        render();

  /** Gambar PNG resolusi tinggi: QR + nama + kode + gedung, siap diatur ukurannya saat dicetak. */
  function qrPng(t){
    var qr = qrcode(0, 'M'); qr.addData(toolUrl(t.id)); qr.make();
    var n = qr.getModuleCount(), cell = Math.max(8, Math.floor(1000 / (n + 8))), quiet = cell * 4;
    var qrPx = n * cell + quiet * 2, W = qrPx, H = qrPx + 260;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#000';
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect(quiet + k * cell, quiet + r * cell, cell, cell);
    g.textAlign = 'center'; g.textBaseline = 'top';
    var fit = function(txt, size, weight){ var s = size; do { g.font = weight + ' ' + s + 'px Helvetica, Arial, sans-serif'; s -= 2; } while (g.measureText(txt).width > W - 60 && s > 20); };
    fit(t.nama, 56, 'bold'); g.fillStyle = '#111'; g.fillText(t.nama, W / 2, qrPx - 10);
    g.font = '600 44px Menlo, Consolas, monospace'; g.fillStyle = '#333'; g.fillText(t.id + '  ·  ' + t.gedung, W / 2, qrPx + 70);
    g.font = 'bold 34px Helvetica, Arial, sans-serif'; g.fillStyle = '#1F5A73'; g.fillText('SCAN UNTUK START / SELESAI', W / 2, qrPx + 150);
    return c;
  }

      if (c.toBlob) c.toBlob(function(b){ var u = URL.createObjectURL(b); save(u); setTimeout(function(){ URL.revokeObjectURL(u); }, 5000); }, 'image/png');

  /** Perkecil foto di HP sebelum dikirim (maks 1600 px, JPEG) supaya cepat & hemat kuota. */
  function fotoKecil(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function(){
        var im = new Image();
        im.onerror = rej;
        im.onload = function(){
          var max = 1600, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ================= FITUR YANG SEDANG DIBUAT ================= */
  var SOON = {
    wlb: { t: 'Worklife Balance', d: 'Ruang santai anggota VG & editor, seperti Threads.', b: ['Posting teks dan gambar', 'Balas dan beri reaksi ke postingan teman', 'Tempat seru-seruan di luar urusan kerja'] },
    kpi: { t: 'Tracking KPI', d: 'KPI pribadi yang terhubung ke sheet KPI masing-masing. Hanya pemilik akun dan admin yang bisa melihat.', b: ['Masukkan link sheet KPI sendiri', 'Pengingat isi KPI setiap akhir bulan', 'Ringkasan KPI dan target bulan depan'] },
    kal: { t: 'Kalender Konten', d: 'Mading jadwal untuk konten flagship dan endorsement Suneeday.', b: ['Kalender jadwal konten flagship & endorsement', 'Tersambung ke papan deadline Suneeday'] }
  };
  function renderSoon(k){
    var s = SOON[k];
    return pageHead(k, s.t, s.d) + '<div class="card soon"><div class="soon-ic">' + ic(NAV_IC[k], 44) + '</div><h2>Fitur ini sedang dalam proses</h2>'
      + '<p class="sub">Sedang kami siapkan. Ini yang akan ada di sini:</p><ul class="evlist">' + s.b.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
      + '<span class="pill pill-warn">Segera hadir</span></div>';
  }

  /* ---------- boot ---------- */
  function startLoggedIn(){ if (view === 'tool') refreshTool(); else { render(); loadTab(); } wsMulai(); }
  // buka langsung dari notifikasi: ?ws=<ruang> atau ?tab=<tab>
  (function(){ var w = (QS.get('ws') || '').trim(), t = (QS.get('tab') || '').trim(); if (!w && !t) return; if (w) { tab = 'ws'; ws.open = w; } else if (/^(mading|rapor|tim|saya|ws)$/.test(t)) tab = t;
    try { QS.delete('ws'); QS.delete('tab'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS.toString() : '') + location.hash); } catch(e){} })();
  if (PARAM_LOGIN) {
    // Link / QR login pribadi: sekali buka, HP langsung tersambung ke akun itu.
    try { QS.delete('login'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS.toString() : '') + location.hash); } catch(e){}
    var prevAuth = auth; auth = null; render();
    call('apiHome', PARAM_LOGIN).then(function(res){
      lg.linking = false;
      if (res.ok && res.user) {
        saveAuth({ token: PARAM_LOGIN, user: res.user });
        render(); toast('HP ini sekarang masuk sebagai ' + res.user.nama + '.'); startLoggedIn();
      } else if (prevAuth) {
        auth = prevAuth; toast('Link login tidak berlaku. Tetap masuk sebagai ' + prevAuth.user.nama + '.'); render(); startLoggedIn();
      } else {
        ui.loginError = res.code === 'NET' ? res.message : 'Link login sudah tidak berlaku (PIN mungkin diganti). Login dengan nama & PIN.';
        render(); loadTeam();
      }
    });
  } else {
    render();
    if (auth) startLoggedIn(); else loadTeam();
  }
  if (BOOT.toolId && !auth) {
    call('apiToolInfo', BOOT.toolId).then(function(res){
      if (!res.ok || !res.tool) return;
      BOOT.tool = res.tool;
      var h = document.getElementById('scan-hint');
      if (h) h.innerHTML = 'Alat: <strong>' + esc(res.tool.nama) + '</strong> &middot; Gedung ' + esc(res.tool.gedung);
    });
  }

  // live-ish: perbarui timer tiap 30 detik, dan ambil data terbaru saat tab HP dibuka lagi
  setInterval(function(){
    if (!auth || busy) return;
    if (view === 'tool' && toolState.group) { render(); return; }
    if (view === 'tool') { var e = document.getElementById('elapsed'); var me = auth.user.id; var m = toolState.opens.filter(function(o){ return o.userId === me; })[0]; if (e && m) e.textContent = fmtDur(m.start); }
    else if (tab === 'saya' && home) render();
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !auth || busy) return;
    if (view === 'tool') refreshTool(); else loadTab();  // termasuk Admin & Cetak QR: alat baru di Sheet langsung ikut
  });
})();
</script>
</body>
</html>
