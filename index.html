<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5A73">
<title>Log Alat Suneeday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECE9E2; --line:#D9D4CA;
    --ink:#1C2126; --ink-dim:#4D555C; --ink-faint:#7A8188;
    --accent:#1F5A73; --accent-ink:#FFFFFF; --accent-soft:#DCEAF0; --accent-soft-ink:#1A4A5E;
    --ok:#3F7D4E; --ok-soft:#DDEEDF; --ok-ink:#24502F;
    --info:#5B4B9A; --info-soft:#E6E1F5; --info-ink:#3F3373;
    --danger:#B23A3A; --danger-soft:#F6DEDB; --danger-ink:#7E2222;
    --warn:#C98A12; --warn-soft:#F7EBCF; --warn-ink:#6E4A05;
    --radius:12px; --radius-sm:8px; --radius-lg:18px;
    --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.06);
    --font-display:'Oswald',system-ui,sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181C; --surface:#1C2227; --surface-2:#242B31; --line:#323B42;
      --ink:#E8ECEF; --ink-dim:#B3BCC3; --ink-faint:#86909A;
      --accent:#6BB3CC; --accent-ink:#0E2129; --accent-soft:#1D3640; --accent-soft-ink:#A9D6E5;
      --ok:#6FBF82; --ok-soft:#1E3324; --ok-ink:#A8DDB3;
      --info:#A898E6; --info-soft:#2A2545; --info-ink:#CFC5F3;
      --danger:#E07A7A; --danger-soft:#3A2020; --danger-ink:#F2B3B3;
      --warn:#E5B04A; --warn-soft:#3A2E14; --warn-ink:#F2D594;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:.01em; margin:0;}
  button,input,select{font-family:inherit; font-size:16px;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}
  main{padding:18px 0 72px;}

  .topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .topbar-inner{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .brand{display:flex; align-items:center; gap:8px; color:var(--accent); flex:1; min-width:0;}
  .brand b{font-family:var(--font-display); font-size:1.05rem; letter-spacing:.03em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .userchip{font-size:.8rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw;}
  .tabbar{display:flex; gap:2px; max-width:720px; margin:0 auto; padding:0 10px; overflow-x:auto;}
  .tabbtn{appearance:none; border:none; background:none; padding:10px 12px; min-height:44px; font-family:var(--font-display); font-size:.92rem; letter-spacing:.02em; color:var(--ink-dim); border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer;}
  .tabbtn.active{color:var(--accent); border-bottom-color:var(--accent);}

  .btn{appearance:none; border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px; min-height:44px; font-weight:600; font-size:.95rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; touch-action:manipulation; transition:transform .06s ease, opacity .15s;}
  .btn:active{transform:scale(.98);}
  a.btn{text-decoration:none;}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-warn{background:var(--warn); color:#241a05;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--ink); border-color:var(--line);}
  .btn-outline{background:transparent; color:var(--accent); border-color:var(--accent);}
  .btn-sm{padding:6px 12px; min-height:38px; font-size:.85rem;}
  .btn-block{width:100%;}
  .btn-xl{width:100%; min-height:64px; font-family:var(--font-display); font-size:1.35rem; letter-spacing:.06em; border-radius:var(--radius);}
  .linkbtn{appearance:none; border:none; background:none; color:var(--ink-dim); text-decoration:underline; font-size:.85rem; padding:6px; cursor:pointer;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
  .section{margin-bottom:26px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .section-head h2{font-size:1.12rem;}
  .sub{color:var(--ink-dim); font-size:.86rem;}
  .faint{color:var(--ink-faint); font-size:.8rem;}
  .mono{font-family:var(--font-mono);}
  .empty{color:var(--ink-faint); font-size:.9rem; padding:14px; text-align:center;}

  .pill{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:.74rem; font-weight:600; white-space:nowrap;}
  .pill-ok{background:var(--ok-soft); color:var(--ok-ink);}
  .pill-info{background:var(--info-soft); color:var(--info-ink);}
  .pill-danger{background:var(--danger-soft); color:var(--danger-ink);}
  .pill-warn{background:var(--warn-soft); color:var(--warn-ink);}
  .pill-neutral{background:var(--surface-2); color:var(--ink-dim);}
  .tag{font-family:var(--font-mono); font-size:.72rem; background:var(--surface-2); color:var(--ink-dim); padding:1px 6px; border-radius:5px;}

  .banner{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-sm); font-size:.92rem;}
  .banner p{margin:0 0 4px;} .banner p:last-child{margin:0;}
  .banner svg{flex:none; margin-top:2px;}
  .banner.ok{background:var(--ok-soft); color:var(--ok-ink);}
  .banner.info{background:var(--info-soft); color:var(--info-ink);}
  .banner.danger{background:var(--danger-soft); color:var(--danger-ink);}
  .banner.warn{background:var(--warn-soft); color:var(--warn-ink);}
  .stack{display:flex; flex-direction:column; gap:10px;}

  /* login */
  .screen-center{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;}
  .login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:28px 24px;}
  .login-mark{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px; color:var(--accent); text-align:center;}
  .login-mark h1{font-size:1.45rem; color:var(--ink);}
  .login-mark span{font-size:.78rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.12em;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.76rem; font-weight:600; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
  .field input,.field select{width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; min-height:44px;}
  .field input:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field input.pin{font-family:var(--font-mono); letter-spacing:.5em; font-size:1.3rem; text-align:center;}
  .form-error{background:var(--danger-soft); color:var(--danger-ink); border-radius:var(--radius-sm); padding:9px 12px; font-size:.86rem; margin-bottom:14px;}
  .scan-hint{background:var(--accent-soft); color:var(--accent-soft-ink); border-radius:var(--radius-sm); padding:10px 12px; font-size:.88rem; margin-bottom:16px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap;}
  /* login cepat: ketuk nama + PIN */
  .step-title{font-family:var(--font-display); font-size:1.05rem; text-align:center; margin:0 0 12px;}
  .team-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .team-btn{appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:var(--radius); padding:12px 10px; min-height:64px; font-weight:600; font-size:.92rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; touch-action:manipulation;}
  .team-btn:active{transform:scale(.97);}
  .team-btn .av{width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:.95rem;}
  .team-btn.last{border-color:var(--accent); background:var(--accent-soft);}
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:6px 0 16px;}
  .pin-dots i{width:16px; height:16px; border-radius:50%; border:2px solid var(--accent); display:block;}
  .pin-dots i.on{background:var(--accent);}
  .pin-dots.shake{animation:shake .35s;}
  @keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .key{appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:var(--radius); min-height:58px; font-family:var(--font-mono); font-size:1.5rem; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  .key:active{background:var(--accent-soft);}
  .key.fn{font-family:var(--font-body); font-size:.85rem; font-weight:600; color:var(--ink-dim);}
  .who-line{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
  .login-qr{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .login-qr .qr-card .cta{color:#B23A3A;}
  .form-row .field{flex:1; min-width:140px;}

  /* tool landing page */
  .tool-hero{padding:20px 18px;}
  .tool-hero .meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .tool-hero h1{font-size:1.7rem; line-height:1.15;}
  .tool-hero .idline{font-family:var(--font-mono); color:var(--ink-faint); font-size:.85rem; margin-top:4px;}
  .status-box{margin:18px 0 16px;}
  .elapsed{font-family:var(--font-mono); font-size:2rem; font-weight:600; color:var(--accent); line-height:1.1; margin-top:6px;}
  .result-note{margin-top:14px;}

  /* lists */
  .row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:8px;}
  .row .grow{flex:1; min-width:0;}
  .row .nm{font-weight:600;}
  .row .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:3px; font-size:.8rem; color:var(--ink-faint);}
  button.row{width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;}
  .gedung-heading{font-family:var(--font-display); font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:16px 0 8px;}
  .searchbar input{width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; margin-bottom:10px;}
  .chiprow{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--ink-dim); padding:7px 14px; min-height:36px; border-radius:999px; font-size:.84rem; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  details.hist{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
  details.hist summary{padding:12px 14px; cursor:pointer; font-weight:600; font-size:.92rem;}
  .hrow{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-top:1px solid var(--line); font-size:.86rem;}
  .hrow .r{text-align:right; flex:none; font-family:var(--font-mono); color:var(--ink-dim); font-size:.8rem;}

  /* admin */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat .num{font-family:var(--font-mono); font-size:1.7rem; font-weight:600; line-height:1;}
  .stat .lbl{font-size:.78rem; color:var(--ink-dim); margin-top:6px;}
  .stat.ok .num{color:var(--ok);} .stat.info .num{color:var(--info);} .stat.danger .num{color:var(--danger);} .stat.warn .num{color:var(--warn);}
  .tbl{width:100%; border-collapse:collapse; font-size:.85rem;}
  .tbl th,.tbl td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
  .tbl th{font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;}
  .tbl td.num{text-align:right; font-family:var(--font-mono);}
  .scroll-x{overflow-x:auto;}

  /* qr */
  .qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .qr-card{border:1px solid var(--line); border-radius:var(--radius); background:#fff; color:#111; padding:12px; text-align:center;}
  .qr-card .qbox{width:132px; height:132px; margin:0 auto 8px;}
  .qr-card .qbox img{width:132px !important; height:132px !important; image-rendering:pixelated; display:block;}
  .qr-card .nm{font-weight:700; font-size:.82rem; line-height:1.2;}
  .qr-card .id{font-family:var(--font-mono); font-size:.72rem; color:#555; margin-top:2px;}
  .qr-card .cta{font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:#1F5A73; font-weight:700; margin-top:6px;}

  /* toast & loading */
  #toast-host{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; pointer-events:none; width:max-content; max-width:92vw;}
  .toast{background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:.88rem; box-shadow:var(--shadow); text-align:center;}
  .loading{display:flex; align-items:center; justify-content:center; gap:10px; padding:40px 0; color:var(--ink-dim); font-size:.9rem;}
  .spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    main{padding:0;}
    .qr-grid{grid-template-columns:repeat(3,1fr); gap:8px;}
    .qr-card{break-inside:avoid; border:1px dashed #999; box-shadow:none;}
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
</style>
</head>

<script>
(function(){
  'use strict';
  // Server data (Google Apps Script). Dipanggil tanpa cookie, jadi login Google di HP tidak berpengaruh.
  var API_URL = 'https://script.google.com/macros/s/AKfycbznnP6WeTM8mu9hQcm611oVcMji1b-TmFvWqBIbttfEvAMlhKoqga8pgP7hkkp4pZJKWA/exec';
  var QS = new URLSearchParams(location.search);
  var PARAM_T = (QS.get('t') || '').trim().toUpperCase();
  var PARAM_LOGIN = (QS.get('login') || '').trim();
  // baseUrl = alamat halaman ini sendiri, jadi QR selalu menunjuk ke halaman ini.
  var BOOT = { toolId: PARAM_T, tool: null, baseUrl: location.origin + location.pathname };
  var AUTH_KEY = 'logalat.auth.v1', LAST_KEY = 'logalat.last.v1';

  /* ---------- state ---------- */
  var auth = loadAuth();
  var view = BOOT.toolId ? 'tool' : 'home';
  var tab = 'saya';
  var toolState = { toolId: BOOT.toolId, tool: BOOT.tool, opens: [], loaded: false, note: null };
  var home = null, admin = null;
  var busy = false, cooldownUntil = 0, mutSeq = 0;
  var lg = { team: null, teamFailed: false, pick: null, pin: '', checking: false, manual: false, linking: !!PARAM_LOGIN };
  var ui = { gedung: 'Semua', query: '', adminGedung: 'Semua', histFilter: 'semua', qrGedung: 'Semua', qrMode: 'alat', loginError: '', toolErr: '', userErr: '' };

  // Login disimpan di 2 tempat (localStorage + cookie 1 tahun) supaya HP tidak "lupa".
  function readCookie(){ try { var m = document.cookie.match(/(?:^|; )logalat_auth=([^;]*)/); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; } }
  function writeCookie(v){ try { document.cookie = 'logalat_auth=' + (v ? encodeURIComponent(v) : '') + '; path=/; max-age=' + (v ? 31536000 : 0) + '; SameSite=Lax; Secure'; } catch(e){} }
  function parseAuth(txt){ try { var a = JSON.parse(txt || 'null'); return (a && a.token && a.user) ? a : null; } catch(e){ return null; } }
  function loadAuth(){
    var ls = null; try { ls = localStorage.getItem(AUTH_KEY); } catch(e){}
    var a = parseAuth(ls) || parseAuth(readCookie());
    if (a && !ls) { try { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); localStorage.setItem(LAST_KEY, a.user.username); } catch(e){} }
    return a;
  }
  function saveAuth(a){
    auth = a; var txt = JSON.stringify(a);
    try { localStorage.setItem(AUTH_KEY, txt); localStorage.setItem(LAST_KEY, a.user.username); } catch(e){}
    writeCookie(txt);
  }
  function clearAuth(){ auth = null; home = null; admin = null; try { localStorage.removeItem(AUTH_KEY); } catch(e){} writeCookie(''); }
  function lastUser(){ try { return localStorage.getItem(LAST_KEY) || ''; } catch(e){ return ''; } }
  function isAdmin(){ return !!(auth && auth.user && auth.user.role === 'admin'); }

  /* ---------- server calls ---------- */
  function call(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, {
      method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(res){ return res || { ok:false, code:'ERR', message:'Respons kosong dari server.' }; })
    .catch(function(){ return { ok:false, code:'NET', message:'Tidak bisa terhubung ke server. Cek internet lalu coba lagi.' }; });
  }
  /** Returns res if ok; otherwise handles auth/errors and returns null. */
  function handle(res){
    if (res && res.ok) return res;
    if (res && res.code === 'AUTH') { clearAuth(); ui.loginError = res.message; render(); if (!lg.team) loadTeam(); return null; }
    toast((res && res.message) || 'Terjadi kesalahan.');
    return null;
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtTime(iso){ try { return new Date(iso).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZone:'Asia/Jakarta'}).replace('.', ':'); } catch(e){ return ''; } } // jam WIB
  function fmtDay(iso){ try { return new Date(iso).toLocaleDateString('id-ID', {day:'numeric', month:'short', timeZone:'Asia/Jakarta'}); } catch(e){ return ''; } }
  function minutesBetween(a, b){ return Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 60000)); }
  function fmtMin(m){ var j = Math.floor(m/60), r = m % 60; return j ? (j + 'j ' + r + 'm') : (r + 'm'); }
  function fmtDur(a, b){ return fmtMin(minutesBetween(a, b)); }
  function statusPill(st){
    if (st === 'tersedia') return '<span class="pill pill-ok">Tersedia</span>';
    if (st === 'dipakai') return '<span class="pill pill-info">Sedang dipakai</span>';
    if (st === 'overlap') return '<span class="pill pill-danger">Overlap</span>';
    return '<span class="pill pill-neutral">' + esc(st) + '</span>';
  }
  function toolUrl(id){ var b = BOOT.baseUrl || ''; return b + (b.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(id); }

  var ICON = {
    mark:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="13" rx="2.5"/><circle cx="12" cy="13" r="3.6"/><path d="M8 6.5l1.6-2.5h4.8L16 6.5"/></svg>',
    warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
    check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>',
    info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>',
    back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
    print:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>'
  };

  var toastTimer = null;
  function toast(msg){
    var host = document.getElementById('toast-host');
    if (!host) return;
    host.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ host.innerHTML = ''; }, 3600);
  }
  function loadingHtml(label){ return '<div class="loading"><span class="spinner"></span>' + esc(label || 'Memuat…') + '</div>'; }

  /* ---------- render root ---------- */
  function render(){
    var root = document.getElementById('root');
    if (!auth) { root.innerHTML = renderLogin(); bindLogin(); return; }
    root.innerHTML = renderTopbar() + '<main><div class="wrap" id="content">' + (view === 'tool' ? renderTool() : renderHome()) + '</div></main>';
    bindTopbar();
    if (view === 'tool') bindTool(); else bindHome();
  }

  /* ---------- login (cepat: ketuk nama -> 4 digit PIN, otomatis masuk) ---------- */
  function initials(n){ var w = String(n || '?').trim().split(/\s+/); return ((w[0] || '?').charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase(); }
  function scanHintHtml(){
    if (!BOOT.toolId) return '';
    return '<div class="scan-hint" id="scan-hint">' + (BOOT.tool ? 'Alat: <strong>' + esc(BOOT.tool.nama) + '</strong> &middot; Gedung ' + esc(BOOT.tool.gedung) : 'Alat: <strong>' + esc(BOOT.toolId) + '</strong>') + '</div>';
  }
  function renderLogin(){
    var head = '<div class="login-mark" style="margin-bottom:14px;">' + ICON.mark + '<h1>Log Alat Suneeday</h1></div>';
    var body;
    if (lg.linking) {
      body = loadingHtml('Menyambungkan akun ke HP ini…');
    } else if (lg.manual || lg.teamFailed) {
      body = '<form id="login-form" autocomplete="on">'
        + '<div class="field"><label for="f-username">Username</label><input id="f-username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required value="' + esc(lastUser()) + '"></div>'
        + '<div class="field"><label for="f-pin">PIN (4 digit)</label><input id="f-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" required></div>'
        + '<button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button></form>'
        + (lg.team ? '<p style="text-align:center; margin:12px 0 0;"><button type="button" class="linkbtn" id="btn-to-team">Pilih nama saja</button></p>' : '');
    } else if (!lg.team) {
      body = loadingHtml('Memuat daftar tim…');
    } else if (!lg.pick) {
      var last = lastUser();
      var team = lg.team.slice().sort(function(a, b){ return (b.username === last) - (a.username === last); });
      body = '<p class="step-title">Siapa kamu?</p><div class="team-grid">'
        + team.map(function(m){
            return '<button type="button" class="team-btn' + (m.username === last ? ' last' : '') + '" data-pick="' + esc(m.username) + '"><span class="av">' + esc(initials(m.nama)) + '</span>' + esc(m.nama) + '</button>';
          }).join('')
        + '</div>';
    } else {
      var dots = '';
      for (var i = 0; i < 4; i++) dots += '<i class="' + (i < lg.pin.length ? 'on' : '') + '"></i>';
      var keys = ['1','2','3','4','5','6','7','8','9','back','0','del'].map(function(k){
        if (k === 'back') return '<button type="button" class="key fn" data-key="back">Ganti<br>nama</button>';
        if (k === 'del') return '<button type="button" class="key fn" data-key="del" aria-label="Hapus">&#9003;</button>';
        return '<button type="button" class="key" data-key="' + k + '">' + k + '</button>';
      }).join('');
      body = '<div class="who-line"><span class="team-btn" style="min-height:0; padding:0; border:none; background:none; flex-direction:row;"><span class="av">' + esc(initials(lg.pick.nama)) + '</span><strong>' + esc(lg.pick.nama) + '</strong></span></div>'
        + '<p class="step-title" style="margin-bottom:6px;">' + (lg.checking ? 'Memeriksa…' : 'Masukkan PIN') + '</p>'
        + '<div class="pin-dots" id="pin-dots">' + dots + '</div>'
        + '<div class="keypad">' + keys + '</div>';
    }
    return '<div class="screen-center"><div class="login-card">' + head + scanHintHtml()
      + (ui.loginError ? '<div class="form-error" id="login-error">' + esc(ui.loginError) + '</div>' : '')
      + body
      + '<p class="faint" style="text-align:center; margin:16px 0 0;">Cukup <strong>sekali</strong> di HP ini. Setelah itu scan QR alat langsung ke tombol Start / Selesai.</p>'
      + (!lg.manual && !lg.teamFailed && !lg.linking ? '<p style="text-align:center; margin:4px 0 0;"><button type="button" class="linkbtn" id="btn-to-manual">Login pakai username</button></p>' : '')
      + '</div></div>';
  }
  function updatePinDots(){
    var d = document.getElementById('pin-dots'); if (!d) return;
    Array.prototype.forEach.call(d.children, function(el, i){ el.className = i < lg.pin.length ? 'on' : ''; });
  }
  function pressKey(k){
    if (!lg.pick || lg.checking) return;
    if (k === 'back') { lg.pick = null; lg.pin = ''; ui.loginError = ''; render(); return; }
    if (k === 'del') { lg.pin = lg.pin.slice(0, -1); updatePinDots(); return; }
    if (!/^[0-9]$/.test(k) || lg.pin.length >= 4) return;
    lg.pin += k; updatePinDots();
    if (lg.pin.length === 4) doLogin(lg.pick.username, lg.pin);
  }
  function afterLogin(){
    ui.loginError = ''; lg.pick = null; lg.pin = ''; lg.checking = false; lg.manual = false;
    if (view === 'tool') { render(); refreshTool(); }
    else { tab = isAdmin() ? 'admin' : 'saya'; render(); loadTab(); }
  }
  function doLogin(username, pin){
    if (busy) return;
    busy = true; lg.checking = true;
    if (lg.pick) render();
    call('apiLogin', username, pin).then(function(res){
      busy = false; lg.checking = false;
      if (!res.ok) {
        ui.loginError = res.message || 'Login gagal.'; lg.pin = ''; render();
        var d = document.getElementById('pin-dots'); if (d) d.classList.add('shake');
        return;
      }
      saveAuth({ token: res.token, user: res.user });
      afterLogin();
    });
  }
  function bindLogin(){
    document.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', function(){
        var u = b.getAttribute('data-pick');
        lg.pick = lg.team.filter(function(m){ return m.username === u; })[0] || null; lg.pin = ''; ui.loginError = ''; render();
      });
    });
    document.querySelectorAll('[data-key]').forEach(function(b){
      b.addEventListener('click', function(){ pressKey(b.getAttribute('data-key')); });
    });
    var tm = document.getElementById('btn-to-manual'); if (tm) tm.addEventListener('click', function(){ lg.manual = true; ui.loginError = ''; render(); });
    var tt = document.getElementById('btn-to-team'); if (tt) tt.addEventListener('click', function(){ lg.manual = false; lg.teamFailed = false; ui.loginError = ''; render(); });
    var f = document.getElementById('login-form');
    if (f) f.addEventListener('submit', function(ev){
      ev.preventDefault();
      var btn = document.getElementById('btn-login'); btn.disabled = true; btn.textContent = 'Memeriksa…';
      doLogin(document.getElementById('f-username').value, document.getElementById('f-pin').value);
    });
  }
  document.addEventListener('keydown', function(ev){
    if (auth || !lg.pick || lg.manual) return;
    if (/^[0-9]$/.test(ev.key)) { pressKey(ev.key); ev.preventDefault(); }
    else if (ev.key === 'Backspace') { pressKey('del'); ev.preventDefault(); }
  });
  function loadTeam(){
    call('apiTeam').then(function(res){
      if (res.ok && res.team && res.team.length) lg.team = res.team; else lg.teamFailed = true;
      if (!auth) render();
    });
  }

  /* ---------- topbar ---------- */
  function renderTopbar(){
    var tabs = '';
    if (view === 'home') {
      tabs = '<div class="tabbar">'
        + tabBtn('saya', 'Alat Saya') + tabBtn('semua', 'Semua Alat')
        + (isAdmin() ? tabBtn('admin', 'Admin') + tabBtn('qr', 'Cetak QR') : '')
        + '</div>';
    }
    return '<div class="topbar no-print"><div class="topbar-inner">'
      + (view === 'tool'
          ? '<button type="button" class="btn btn-ghost btn-sm" id="btn-home">' + ICON.back + ' Dashboard</button><div class="brand"></div>'
          : '<div class="brand">' + ICON.mark + '<b>Log Alat Suneeday</b></div>')
      + '<span class="userchip">' + esc(auth.user.nama) + '</span>'
      + '<button type="button" class="linkbtn" id="btn-logout">Keluar</button>'
      + '</div>' + tabs + '</div>';
  }
  function tabBtn(k, label){ return '<button type="button" class="tabbtn' + (tab === k ? ' active' : '') + '" data-tab="' + k + '">' + esc(label) + '</button>'; }
  function bindTopbar(){
    var lo = document.getElementById('btn-logout');
    if (lo) lo.addEventListener('click', function(){
      if (!lo.getAttribute('data-armed')) {
        lo.setAttribute('data-armed', '1'); lo.textContent = 'Yakin keluar?';
        setTimeout(function(){ if (lo.isConnected) { lo.removeAttribute('data-armed'); lo.textContent = 'Keluar'; } }, 3000);
        return;
      }
      clearAuth(); view = BOOT.toolId ? 'tool' : 'home'; lg.pick = null; lg.pin = ''; render(); if (!lg.team) loadTeam();
    });
    var hb = document.getElementById('btn-home');
    if (hb) hb.addEventListener('click', function(){ view = 'home'; tab = 'saya'; render(); loadTab(); });
    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ tab = b.getAttribute('data-tab'); render(); loadTab(); });
    });
  }

  /* ---------- tool landing page (hasil scan) ---------- */
  function renderTool(){
    var t = toolState.tool;
    if (!toolState.loaded) return loadingHtml('Memuat data alat…');
    if (!t) {
      return '<div class="card tool-hero"><div class="banner danger">' + ICON.warn + '<div><p><strong>Alat tidak ditemukan.</strong></p><p>Kode <span class="mono">' + esc(toolState.toolId || '-') + '</span> tidak terdaftar. Hubungi admin.</p></div></div></div>';
    }
    var me = auth.user.id;
    var mine = toolState.opens.filter(function(o){ return o.userId === me; })[0];
    var others = toolState.opens.filter(function(o){ return o.userId !== me; });
    var otherHtml = others.map(function(o){
      return '<p>Sedang dipakai oleh <strong>' + esc(o.userNama) + '</strong> sejak <strong>' + esc(fmtTime(o.start)) + ' WIB</strong>' + (o.overdue ? ' (' + esc(fmtDay(o.start)) + ', belum ditutup)' : '') + ' &middot; ' + esc(fmtDur(o.start)) + '</p>';
    }).join('');

    var statusHtml, actionHtml;
    if (mine) {
      statusHtml = '<div class="banner ok">' + ICON.check + '<div><p>Sedang <strong>Anda pakai</strong> sejak <strong>' + esc(fmtTime(mine.start)) + ' WIB</strong>' + (mine.overdue ? ' (' + esc(fmtDay(mine.start)) + ')' : '') + '</p><div class="elapsed" id="elapsed">' + esc(fmtDur(mine.start)) + '</div></div></div>'
        + (mine.overdue ? '<div class="banner warn" style="margin-top:10px;">' + ICON.warn + '<p>Sesi ini dari hari sebelumnya dan belum ditutup. Tutup sekarang kalau sudah selesai.</p></div>' : '')
        + (others.length ? '<div class="banner danger" style="margin-top:10px;">' + ICON.warn + '<div>' + otherHtml + '</div></div>' : '');
      actionHtml = '<button type="button" class="btn btn-danger btn-xl" id="btn-act" data-act="stop">SELESAI</button>';
    } else if (others.length) {
      statusHtml = '<div class="banner danger">' + ICON.warn + '<div>' + otherHtml + '<p>Anda tetap bisa memakai — sesi ini akan dicatat sebagai <strong>overlap</strong>.</p></div></div>';
      actionHtml = '<button type="button" class="btn btn-warn btn-xl" id="btn-act" data-act="start">START (OVERLAP)</button>';
    } else {
      statusHtml = '<div class="banner ok">' + ICON.check + '<p>Alat <strong>tersedia</strong> dan siap dipakai.</p></div>';
      actionHtml = '<button type="button" class="btn btn-ok btn-xl" id="btn-act" data-act="start">START</button>';
    }
    var note = toolState.note ? '<div class="result-note banner ' + toolState.note.kind + '">' + (toolState.note.kind === 'ok' ? ICON.check : ICON.info) + '<p>' + esc(toolState.note.text) + '</p></div>' : '';

    return '<div class="card tool-hero">'
      + '<div class="meta"><span class="pill pill-neutral">' + esc(t.jenis) + '</span><span class="pill pill-neutral">Gedung ' + esc(t.gedung) + '</span></div>'
      + '<h1>' + esc(t.nama) + '</h1><div class="idline">' + esc(t.id) + '</div>'
      + '<div class="status-box">' + statusHtml + '</div>'
      + actionHtml
      + note
      + '</div>'
      + '<p class="faint" style="text-align:center; margin-top:14px;">Masuk sebagai ' + esc(auth.user.nama) + '. Halaman ini boleh tetap dibuka — tombol Selesai bisa ditekan nanti tanpa scan ulang.</p>';
  }
  function bindTool(){
    var b = document.getElementById('btn-act');
    if (!b) return;
    b.addEventListener('click', function(){
      if (busy || Date.now() < cooldownUntil) return;
      var act = b.getAttribute('data-act');
      busy = true; mutSeq++; b.disabled = true; b.textContent = 'Memproses…';
      call(act === 'stop' ? 'apiStop' : 'apiStart', auth.token, toolState.toolId).then(function(res){
        busy = false; cooldownUntil = Date.now() + 1500;
        var ok = handle(res);
        if (!ok) { if (auth) render(); return; }
        toolState.tool = ok.tool; toolState.opens = ok.opens || [];
        toolState.note = { kind: ok.already ? 'info' : 'ok', text: ok.message };
        home = null; admin = null;
        render();
        toast(ok.message);
      });
    });
  }
  function refreshTool(){
    if (!auth || view !== 'tool' || busy) return;
    var seq = mutSeq, forId = toolState.toolId;
    call('apiTool', auth.token, forId).then(function(res){
      // abaikan hasil yang sudah basi (ada Start/Selesai setelah request ini dikirim, atau pindah alat)
      if (seq !== mutSeq || forId !== toolState.toolId) return;
      var ok = handle(res);
      if (!ok) return;
      toolState.tool = ok.tool; toolState.opens = ok.opens || []; toolState.loaded = true;
      if (view === 'tool' && !busy) render();
    });
  }

  /* ---------- home ---------- */
  function loadTab(){
    if (!auth || view !== 'home') return;
    if (tab === 'admin' || tab === 'qr') {
      if (!isAdmin()) { tab = 'saya'; render(); return; }
      call('apiAdmin', auth.token).then(function(res){ var ok = handle(res); if (!ok) return; admin = ok; if (view === 'home' && (tab === 'admin' || tab === 'qr')) render(); });
    } else {
      call('apiHome', auth.token).then(function(res){ var ok = handle(res); if (!ok) return; home = ok; if (view === 'home' && (tab === 'saya' || tab === 'semua')) render(); });
    }
  }
  function renderHome(){
    if (tab === 'admin') return admin ? renderAdmin() : loadingHtml();
    if (tab === 'qr') return admin ? renderQr() : loadingHtml();
    if (!home) return loadingHtml();
    return tab === 'semua' ? renderSemua() : renderSaya();
  }
  function bindHome(){
    if (tab === 'saya') bindSaya();
    else if (tab === 'semua') bindSemua();
    else if (tab === 'admin') bindAdmin();
    else if (tab === 'qr') bindQr();
  }

  function renderSaya(){
    var open = home.mineOpen;
    var overdue = open.filter(function(s){ return s.overdue; });
    var banner = overdue.length ? '<div class="section"><div class="banner warn">' + ICON.warn + '<div><p><strong>' + overdue.length + ' sesi belum ditutup</strong> dari hari sebelumnya (tercatat sebagai pelanggaran SOP).</p><p>Tekan Selesai di bawah kalau alatnya sudah tidak dipakai.</p></div></div></div>' : '';
    var list = open.length ? open.map(function(s){
      return '<div class="row"><div class="grow"><div class="nm">' + esc(s.toolNama) + '</div>'
        + '<div class="meta"><span class="tag">' + esc(s.toolId) + '</span><span>Gedung ' + esc(s.gedung) + '</span><span>sejak ' + esc(fmtTime(s.start)) + ' WIB' + (s.overdue ? ' ' + esc(fmtDay(s.start)) : '') + '</span>' + (s.status === 'overlap' ? statusPill('overlap') : '') + (s.overdue ? '<span class="pill pill-warn">Belum ditutup</span>' : '') + '</div>'
        + '<div class="mono" style="color:var(--accent); font-weight:600; margin-top:4px;">' + esc(fmtDur(s.start)) + '</div></div>'
        + '<button type="button" class="btn btn-danger btn-sm" data-stop="' + esc(s.toolId) + '">Selesai</button></div>';
    }).join('') : '<div class="card empty">Tidak ada alat yang sedang Anda pakai.<br>Scan QR di alat untuk mulai.</div>';
    var hist = home.hist.length ? home.hist.map(function(s){
      return '<div class="hrow"><div><div style="font-weight:600;">' + esc(s.toolNama) + '</div><div class="faint">' + esc(fmtDay(s.start)) + ' &middot; ' + esc(fmtTime(s.start)) + '–' + esc(fmtTime(s.end)) + ' WIB' + (s.status === 'overlap' ? ' &middot; overlap' : '') + '</div></div><div class="r">' + esc(fmtDur(s.start, s.end)) + '</div></div>';
    }).join('') : '<div class="empty">Belum ada riwayat.</div>';
    return banner
      + '<div class="section"><div class="section-head"><h2>Sedang Saya Pakai</h2><span class="faint">' + open.length + ' alat</span></div>' + list + '</div>'
      + '<div class="section"><details class="hist"><summary>Riwayat Pemakaian Saya (' + home.hist.length + ')</summary>' + hist + '</details></div>';
  }
  function bindSaya(){
    document.querySelectorAll('[data-stop]').forEach(function(b){
      b.addEventListener('click', function(){
        if (busy) return;
        busy = true; b.disabled = true; b.textContent = '…';
        call('apiStop', auth.token, b.getAttribute('data-stop')).then(function(res){
          busy = false;
          var ok = handle(res);
          if (ok) toast(ok.message);
          loadTab();
        });
      });
    });
  }

  function renderSemua(){
    var chips = ['Semua','S25','S29'].map(function(g){ return '<button type="button" class="chip' + (ui.gedung === g ? ' active' : '') + '" data-gedung="' + g + '">' + g + '</button>'; }).join('');
    return '<div class="section-head"><h2>Semua Alat</h2></div>'
      + '<p class="sub" style="margin:-4px 0 12px;">Tanpa QR? Ketuk alat untuk membuka halamannya.</p>'
      + '<div class="searchbar"><input id="f-search" type="search" placeholder="Cari nama atau kode alat…" value="' + esc(ui.query) + '"></div>'
      + '<div class="chiprow">' + chips + '</div>'
      + '<div id="tool-list">' + renderToolList() + '</div>';
  }
  function renderToolList(){
    var q = ui.query.trim().toLowerCase();
    var list = home.tools.filter(function(t){
      if (ui.gedung !== 'Semua' && t.gedung !== ui.gedung) return false;
      return !q || (t.nama + ' ' + t.id + ' ' + t.jenis).toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) return '<div class="empty">Tidak ada alat yang cocok.</div>';
    var out = '', lastG = '';
    list.forEach(function(t){
      if (ui.gedung === 'Semua' && t.gedung !== lastG) { out += '<div class="gedung-heading">Gedung ' + esc(t.gedung) + '</div>'; lastG = t.gedung; }
      var st = t.openCount === 0 ? 'tersedia' : (t.openCount > 1 ? 'overlap' : 'dipakai');
      out += '<button type="button" class="row" data-open-tool="' + esc(t.id) + '"><div class="grow"><div class="nm">' + esc(t.nama) + '</div>'
        + '<div class="meta">' + statusPill(st) + '<span class="tag">' + esc(t.id) + '</span>' + (t.holders.length ? '<span>' + esc(t.holders.join(', ')) + '</span>' : '') + '</div></div>'
        + '<span class="pill ' + (t.mine ? 'pill-danger' : 'pill-ok') + '">' + (t.mine ? 'Selesai' : 'Start') + ' ›</span></button>';
    });
    return out;
  }
  function bindToolListClicks(){
    document.querySelectorAll('[data-open-tool]').forEach(function(b){
      b.addEventListener('click', function(){ openTool(b.getAttribute('data-open-tool')); });
    });
  }
  function bindSemua(){
    var s = document.getElementById('f-search');
    if (s) s.addEventListener('input', function(){ ui.query = s.value; document.getElementById('tool-list').innerHTML = renderToolList(); bindToolListClicks(); });
    document.querySelectorAll('[data-gedung]').forEach(function(c){ c.addEventListener('click', function(){ ui.gedung = c.getAttribute('data-gedung'); render(); }); });
    bindToolListClicks();
  }
  function openTool(id){
    view = 'tool';
    toolState = { toolId: id, tool: null, opens: [], loaded: false, note: null };
    render();
    refreshTool();
    window.scrollTo(0, 0);
  }

  /* ---------- admin ---------- */
  function renderAdmin(){
    var a = admin, k = a.kpi;
    var stats = '<div class="stat-row">'
      + '<div class="stat ok"><div class="num">' + k.tersedia + '</div><div class="lbl">Tersedia</div></div>'
      + '<div class="stat info"><div class="num">' + k.dipakai + '</div><div class="lbl">Sedang Dipakai</div></div>'
      + '<div class="stat danger"><div class="num">' + k.overlap + '</div><div class="lbl">Overlap Aktif</div></div>'
      + '<div class="stat warn"><div class="num">' + k.belumDitutup + '</div><div class="lbl">Belum Ditutup</div></div></div>';

    var gchips = ['Semua','S25','S29'].map(function(g){ return '<button type="button" class="chip' + (ui.adminGedung === g ? ' active' : '') + '" data-admin-gedung="' + g + '">' + g + '</button>'; }).join('');
    var inG = function(g){ return ui.adminGedung === 'Semua' || g === ui.adminGedung; };
    var status = a.status.filter(function(t){ return inG(t.gedung); }).map(function(t){
      var who = t.opens.map(function(o){ return '<div class="faint" style="margin-top:2px;">' + esc(o.userNama) + ' &middot; sejak ' + esc(fmtTime(o.start)) + ' WIB ' + esc(fmtDay(o.start)) + ' &middot; ' + esc(fmtDur(o.start)) + (o.overdue ? ' &middot; <strong>belum ditutup</strong>' : '') + '</div>'; }).join('');
      return '<div class="row" style="align-items:flex-start;"><div class="grow"><div class="nm">' + esc(t.nama) + '</div><div class="meta">' + statusPill(t.status) + (t.opens.some(function(o){ return o.overdue; }) ? '<span class="pill pill-warn">Belum ditutup</span>' : '') + '<span class="tag">' + esc(t.id) + '</span></div>' + who + '</div></div>';
    }).join('') || '<div class="empty">Tidak ada alat.</div>';

    var hchips = [['semua','Semua Sesi'],['bermasalah','Bermasalah Saja']].map(function(c){ return '<button type="button" class="chip' + (ui.histFilter === c[0] ? ' active' : '') + '" data-hist="' + c[0] + '">' + c[1] + '</button>'; }).join('');
    var sess = a.sessions.filter(function(s){ return inG(s.gedung) && (ui.histFilter !== 'bermasalah' || s.status === 'overlap' || s.overdue); });
    var hist = sess.length ? sess.map(function(s){
      var badge = s.status === 'overlap' ? statusPill('overlap') : (s.overdue ? '<span class="pill pill-warn">Belum ditutup</span>' : (s.end ? '<span class="pill pill-neutral">Selesai</span>' : '<span class="pill pill-ok">Berjalan</span>'));
      var waktu = s.end ? esc(fmtTime(s.start)) + '–' + esc(fmtTime(s.end)) + ' WIB' : 'sejak ' + esc(fmtTime(s.start)) + ' WIB';
      return '<div class="hrow"><div><div style="font-weight:600;">' + esc(s.toolNama) + '</div><div class="faint" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' + esc(s.userNama) + ' &middot; ' + esc(s.gedung) + ' &middot; ' + esc(fmtDay(s.start)) + ' ' + waktu + ' ' + badge + '</div></div><div class="r">' + esc(fmtDur(s.start, s.end)) + '</div></div>';
    }).join('') : '<div class="empty">Tidak ada sesi untuk filter ini.</div>';

    var rk = a.ringkasan.filter(function(r){ return inG(r.gedung); }).sort(function(x, y){ return y.overlap - x.overlap || y.menit - x.menit; });
    var rkHtml = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Alat</th><th class="num">Sesi</th><th class="num">Total</th><th class="num">Overlap</th></tr></thead><tbody>'
      + rk.map(function(r){ return '<tr><td>' + esc(r.nama) + '<div class="faint mono">' + esc(r.id) + '</div></td><td class="num">' + r.sesi + '</td><td class="num">' + esc(fmtMin(r.menit)) + '</td><td class="num">' + (r.overlap ? '<strong style="color:var(--danger)">' + r.overlap + '</strong>' : '0') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';

    var jenisOpts = ['Kamera','Lighting','Mic','Tripod','Lensa','Lainnya'].map(function(j){ return '<option>' + j + '</option>'; }).join('');
    var userList = a.users.slice().sort(function(x, y){ return x.nama.localeCompare(y.nama); }).map(function(u){
      return '<div class="hrow"><div><div style="font-weight:600;">' + esc(u.nama) + (u.role === 'admin' ? ' <span class="tag">Admin</span>' : '') + '</div><div class="faint">' + esc(u.username) + '</div></div><div class="r">PIN ' + esc(u.pin) + '</div></div>';
    }).join('');

    return stats
      + '<div class="section"><div class="section-head"><h2>Status Semua Alat</h2><button type="button" class="linkbtn" id="btn-refresh">Muat ulang</button></div><div class="chiprow">' + gchips + '</div>' + status + '</div>'
      + '<div class="section"><div class="section-head"><h2>Riwayat &amp; Sesi Bermasalah</h2></div><div class="chiprow">' + hchips + '</div><div class="card" style="padding:0; overflow:hidden;">' + hist + '</div></div>'
      + '<div class="section"><div class="section-head"><h2>Ringkasan 30 Hari per Alat</h2></div><p class="sub" style="margin:-4px 0 10px;">Alat yang sering overlap = tanda stoknya kurang.</p><div class="card" style="padding:4px 6px;">' + rkHtml + '</div></div>'
      + '<div class="section"><div class="section-head"><h2>Tambah Alat</h2></div><div class="card"><form id="form-tool">'
      + (ui.toolErr ? '<div class="form-error">' + esc(ui.toolErr) + '</div>' : '')
      + '<div class="form-row"><div class="field"><label for="ft-id">Kode Alat</label><input id="ft-id" type="text" placeholder="cth. S25-CAM-03" autocapitalize="characters" required></div>'
      + '<div class="field"><label for="ft-gedung">Gedung</label><select id="ft-gedung"><option>S25</option><option>S29</option></select></div></div>'
      + '<div class="form-row"><div class="field"><label for="ft-nama">Nama Alat</label><input id="ft-nama" type="text" placeholder="cth. Kamera Sony A7 IV" required></div>'
      + '<div class="field"><label for="ft-jenis">Jenis</label><select id="ft-jenis">' + jenisOpts + '</select></div></div>'
      + '<button type="submit" class="btn btn-primary">Tambah Alat</button></form></div></div>'
      + '<div class="section"><div class="section-head"><h2>Tambah Akun / Personel</h2></div><div class="card"><form id="form-user">'
      + (ui.userErr ? '<div class="form-error">' + esc(ui.userErr) + '</div>' : '')
      + '<div class="form-row"><div class="field"><label for="fu-nama">Nama</label><input id="fu-nama" type="text" placeholder="cth. Putri Ayu" required></div>'
      + '<div class="field"><label for="fu-role">Role</label><select id="fu-role"><option value="vg">Videographer</option><option value="admin">Admin</option></select></div></div>'
      + '<div class="form-row"><div class="field"><label for="fu-username">Username</label><input id="fu-username" type="text" placeholder="cth. putri" autocapitalize="off" required></div>'
      + '<div class="field"><label for="fu-pin">PIN (4 digit)</label><input id="fu-pin" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></div></div>'
      + '<div style="display:flex; gap:8px; flex-wrap:wrap;"><button type="submit" class="btn btn-primary">Tambah Akun</button><button type="button" class="btn btn-ghost" id="btn-randpin">Acak PIN</button></div></form></div>'
      + '<details class="hist" style="margin-top:10px;"><summary>Daftar Akun (' + a.users.length + ')</summary>' + userList + '</details></div>'
      + '<div class="section"><div class="card"><p class="sub" style="margin:0 0 10px;">Semua data (alat, akun, sesi) tersimpan di Google Sheet. Edit atau hapus data langsung di sana.</p>'
      + '<a class="btn btn-outline btn-sm" href="' + esc(a.sheetUrl) + '" target="_blank" rel="noopener">Buka Google Sheet</a></div></div>';
  }
  function bindAdmin(){
    document.querySelectorAll('[data-admin-gedung]').forEach(function(c){ c.addEventListener('click', function(){ ui.adminGedung = c.getAttribute('data-admin-gedung'); render(); }); });
    document.querySelectorAll('[data-hist]').forEach(function(c){ c.addEventListener('click', function(){ ui.histFilter = c.getAttribute('data-hist'); render(); }); });
    var rf = document.getElementById('btn-refresh'); if (rf) rf.addEventListener('click', function(){ loadTab(); toast('Memuat ulang…'); });
    var rp = document.getElementById('btn-randpin'); if (rp) rp.addEventListener('click', function(){ document.getElementById('fu-pin').value = String(Math.floor(1000 + Math.random() * 9000)); });
    var ft = document.getElementById('form-tool');
    if (ft) ft.addEventListener('submit', function(ev){
      ev.preventDefault(); if (busy) return; busy = true;
      var data = { id: val('ft-id'), nama: val('ft-nama'), jenis: val('ft-jenis'), gedung: val('ft-gedung') };
      call('apiAddTool', auth.token, data).then(function(res){
        busy = false;
        if (res.ok) { ui.toolErr = ''; toast(res.message); loadTab(); }
        else if (res.code === 'AUTH') handle(res);
        else { ui.toolErr = res.message; render(); restore('ft-', data); }
      });
    });
    var fu = document.getElementById('form-user');
    if (fu) fu.addEventListener('submit', function(ev){
      ev.preventDefault(); if (busy) return; busy = true;
      var data = { nama: val('fu-nama'), username: val('fu-username'), pin: val('fu-pin'), role: val('fu-role') };
      call('apiAddUser', auth.token, data).then(function(res){
        busy = false;
        if (res.ok) { ui.userErr = ''; toast(res.message); loadTab(); }
        else if (res.code === 'AUTH') handle(res);
        else { ui.userErr = res.message; render(); restore('fu-', data); }
      });
    });
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }
  function restore(prefix, data){ Object.keys(data).forEach(function(k){ var el = document.getElementById(prefix + k); if (el) el.value = data[k]; }); }

  /* ---------- cetak QR ---------- */
  function loginUrl(u){ return (BOOT.baseUrl || '') + '?login=' + encodeURIComponent(u.token); }
  function renderQr(){
    var modes = '<div class="chiprow no-print">' + [['alat','QR Alat'],['login','QR Login Tim']].map(function(m){ return '<button type="button" class="chip' + (ui.qrMode === m[0] ? ' active' : '') + '" data-qr-mode="' + m[0] + '">' + m[1] + '</button>'; }).join('') + '</div>';
    return modes + (ui.qrMode === 'login' ? renderLoginQr() : renderToolQr());
  }
  function renderLoginQr(){
    var users = admin.users.filter(function(u){ return u.token; }).slice().sort(function(x, y){ return x.nama.localeCompare(y.nama); });
    var cards = users.map(function(u){
      return '<div class="qr-card"><div class="qbox" id="lq-' + esc(u.id) + '"></div><div class="nm">' + esc(u.nama) + '</div><div class="id">' + esc(u.username) + (u.role === 'admin' ? ' &middot; admin' : '') + '</div><div class="cta">Login sekali &middot; pribadi</div>'
        + '<div class="no-print" style="display:flex; gap:6px; justify-content:center; margin-top:8px; flex-wrap:wrap;">'
        + '<button type="button" class="btn btn-ghost btn-sm" data-copy-login="' + esc(u.id) + '">Salin link</button>'
        + '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent('Link login Log Alat Suneeday untuk ' + u.nama + ' (buka sekali di HP kamu, jangan dibagikan): ' + loginUrl(u)) + '">WhatsApp</a></div></div>';
    }).join('');
    return '<div class="no-print section">'
      + '<div class="section-head"><h2>QR Login Tim</h2></div>'
      + '<p class="sub" style="margin:0 0 10px;">Biar tim <strong>tidak perlu mengetik apa pun</strong>: minta tiap VG scan QR namanya di layar ini <strong>pakai kamera HP yang sama</strong> dengan yang dipakai untuk scan alat (atau kirim link-nya lewat WhatsApp). Sekali saja — setelah itu setiap scan QR alat langsung ke tombol Start / Selesai.</p>'
      + '<div class="banner warn" style="margin-bottom:12px;">' + ICON.warn + '<p>QR / link ini = kunci akun. <strong>Jangan ditempel di alat</strong> atau dikirim ke grup. Kalau bocor, ganti PIN orang itu di Sheet — link lamanya otomatis mati.</p></div>'
      + '</div>'
      + '<div class="qr-grid login-qr">' + (cards || '<div class="empty">Server belum mendukung QR login. Perbarui Apps Script.</div>') + '</div>';
  }
  function renderToolQr(){
    var base = BOOT.baseUrl || '';
    var looksOk = /^https:\/\//.test(base);
    var chips = ['Semua','S25','S29'].map(function(g){ return '<button type="button" class="chip' + (ui.qrGedung === g ? ' active' : '') + '" data-qr-gedung="' + g + '">' + g + '</button>'; }).join('');
    var list = admin.tools.filter(function(t){ return ui.qrGedung === 'Semua' || t.gedung === ui.qrGedung; });
    var cards = list.map(function(t){
      return '<div class="qr-card"><div class="qbox" id="qr-' + esc(t.id) + '"></div><div class="nm">' + esc(t.nama) + '</div><div class="id">' + esc(t.id) + ' &middot; ' + esc(t.gedung) + '</div><div class="cta">Scan untuk Start / Selesai</div></div>';
    }).join('');
    return '<div class="no-print section">'
      + '<div class="section-head"><h2>Cetak QR Alat</h2><button type="button" class="btn btn-primary btn-sm" id="btn-print">' + ICON.print + ' Cetak</button></div>'
      + '<p class="sub" style="margin:0 0 10px;">1 stiker per alat. Scan langsung membuka halaman alat itu; tombol Start / Selesai muncul otomatis.</p>'
      + (looksOk ? '' : '<div class="banner warn" style="margin-bottom:10px;">' + ICON.warn + '<p>Link di QR belum terlihat seperti link web app final (berakhiran <span class="mono">/exec</span>). Isi kolom BASE_URL di tab <strong>Config</strong> pada Google Sheet dengan link web app Anda, lalu muat ulang halaman ini.</p></div>')
      + '<p class="faint" style="margin:0 0 10px; word-break:break-all;">Link di QR: <span class="mono">' + esc(base) + '?t=…</span></p>'
      + '<div class="chiprow">' + chips + '</div>'
      + '<p class="faint" style="margin:0 0 12px;">Kalau tombol Cetak tidak merespons, pakai menu browser → Print (atau Ctrl+P). Di HP, tekan lama gambar QR untuk menyimpannya.</p>'
      + '</div>'
      + '<div class="qr-grid">' + (cards || '<div class="empty">Belum ada alat.</div>') + '</div>';
  }
  function drawQr(el, text, alt){
    el.setAttribute('data-qr', text);
    try { var qr = qrcode(0, 'M'); qr.addData(text); qr.make(); el.innerHTML = qr.createImgTag(qr.getModuleCount() > 41 ? 4 : 6, 12, alt); }
    catch(e){ el.innerHTML = '<div class="faint">QR gagal dibuat</div>'; }
  }
  function copyText(t){
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function(){ toast('Link disalin.'); }, function(){ toast(t); });
    toast(t);
  }
  function bindQr(){
    document.querySelectorAll('[data-qr-mode]').forEach(function(c){ c.addEventListener('click', function(){ ui.qrMode = c.getAttribute('data-qr-mode'); render(); }); });
    if (ui.qrMode === 'login') {
      admin.users.forEach(function(u){ var el = document.getElementById('lq-' + u.id); if (el && u.token) drawQr(el, loginUrl(u), 'QR login ' + u.nama); });
      document.querySelectorAll('[data-copy-login]').forEach(function(b){
        b.addEventListener('click', function(){ var u = admin.users.filter(function(x){ return x.id === b.getAttribute('data-copy-login'); })[0]; if (u) copyText(loginUrl(u)); });
      });
      return;
    }
    document.querySelectorAll('[data-qr-gedung]').forEach(function(c){ c.addEventListener('click', function(){ ui.qrGedung = c.getAttribute('data-qr-gedung'); render(); }); });
    var p = document.getElementById('btn-print');
    if (p) p.addEventListener('click', function(){ try { window.print(); } catch(e){ toast('Pakai menu browser → Print.'); } });
    admin.tools.forEach(function(t){
      var el = document.getElementById('qr-' + t.id);
      if (!el) return;
      var text = toolUrl(t.id);
      el.setAttribute('data-qr', text);
      try {
        var qr = qrcode(0, 'M'); qr.addData(text); qr.make();
        el.innerHTML = qr.createImgTag(6, 12, 'QR ' + t.id);
      } catch(e){ el.innerHTML = '<div class="faint">QR gagal dibuat</div>'; }
    });
  }

  /* ---------- boot ---------- */
  function startLoggedIn(){ if (view === 'tool') refreshTool(); else { if (isAdmin()) tab = 'admin'; render(); loadTab(); } }
  if (PARAM_LOGIN) {
    // Link / QR login pribadi: sekali buka, HP langsung tersambung ke akun itu.
    try { QS.delete('login'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS.toString() : '') + location.hash); } catch(e){}
    var prevAuth = auth; auth = null; render();
    call('apiHome', PARAM_LOGIN).then(function(res){
      lg.linking = false;
      if (res.ok && res.user) {
        saveAuth({ token: PARAM_LOGIN, user: res.user });
        render(); toast('HP ini sekarang masuk sebagai ' + res.user.nama + '.'); startLoggedIn();
      } else if (prevAuth) {
        auth = prevAuth; toast('Link login tidak berlaku. Tetap masuk sebagai ' + prevAuth.user.nama + '.'); render(); startLoggedIn();
      } else {
        ui.loginError = res.code === 'NET' ? res.message : 'Link login sudah tidak berlaku (PIN mungkin diganti). Login dengan nama & PIN.';
        render(); loadTeam();
      }
    });
  } else {
    render();
    if (auth) startLoggedIn(); else loadTeam();
  }
  if (BOOT.toolId && !auth) {
    call('apiToolInfo', BOOT.toolId).then(function(res){
      if (!res.ok || !res.tool) return;
      BOOT.tool = res.tool;
      var h = document.getElementById('scan-hint');
      if (h) h.innerHTML = 'Alat: <strong>' + esc(res.tool.nama) + '</strong> &middot; Gedung ' + esc(res.tool.gedung);
    });
  }

  // live-ish: perbarui timer tiap 30 detik, dan ambil data terbaru saat tab HP dibuka lagi
  setInterval(function(){
    if (!auth || busy) return;
    if (view === 'tool') { var e = document.getElementById('elapsed'); var me = auth.user.id; var m = toolState.opens.filter(function(o){ return o.userId === me; })[0]; if (e && m) e.textContent = fmtDur(m.start); }
    else if (tab === 'saya' && home) render();
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !auth || busy) return;
    if (view === 'tool') refreshTool(); else if (tab === 'saya' || tab === 'semua') loadTab();
  });
})();
</script>
</body>
</html>
